.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L33<tspan class="ex-dot" dx="10">NEGATIVE</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">Claims from the literature that failed when we ran them</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="476" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="476" rx="12"/><path class="ex-chev" d="M274.0 352.0l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="476" rx="12"/><path class="ex-chev" d="M630.0 352.0l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="476" rx="12"/><path class="ex-chev" d="M940.0 352.0l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Do published</tspan><tspan x="38" dy="24.7">recipes for</tspan><tspan x="38" dy="24.7">training small</tspan><tspan x="38" dy="24.7">ternary models</tspan><tspan x="38" dy="24.7">work as claimed</tspan><tspan x="38" dy="24.7">on ordinary</tspan><tspan x="38" dy="24.7">hardware?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="364.1" y2="364.1"/><text class="ex-lab" x="38" y="382.1" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="402.1" font-size="14"><tspan x="38" dy="0">Recipes repeated in papers</tspan><tspan x="38" dy="18.9">and blog posts can fail on</tspan><tspan x="38" dy="18.9">ordinary hardware.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="212.7" r="11"/><text class="ex-numt" x="322" y="217.2" font-size="13" text-anchor="middle">1</text><g transform="translate(340 201.72) scale(0.917)"><path class="ex-ic" d="M9 6h11 M9 12h11 M9 18h11 M4 6h.5 M4 12h.5 M4 18h.5"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Record each cited recipe as</tspan><tspan x="372" dy="18.5">refuted, corrected or</tspan><tspan x="372" dy="18.5">surviving.</tspan></text><rect class="ex-sub" x="302" y="269.4" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="306.9" r="11"/><text class="ex-numt" x="322" y="311.4" font-size="13" text-anchor="middle">2</text><g transform="translate(340 295.92) scale(0.917)"><path class="ex-ic" d="M8 5l11 7-11 7z"/></g><text class="ex-t" x="372" y="301.7" font-size="14"><tspan x="372" dy="0">Run it on our target machine</tspan><tspan x="372" dy="18.5">where we can.</tspan></text><rect class="ex-sub" x="302" y="354.4" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="391.9" r="11"/><text class="ex-numt" x="322" y="396.4" font-size="13" text-anchor="middle">3</text><g transform="translate(340 380.88) scale(0.917)"><path class="ex-ic" d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/></g><text class="ex-t" x="372" y="386.7" font-size="14"><tspan x="372" dy="0">Where we cannot, say so and</tspan><tspan x="372" dy="18.5">cite the stated requirement.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="440" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="96" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">NEGATIVE</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">2 recipe</tspan><tspan x="664" dy="31.4">claims refuted</tspan></text><text class="ex-t" x="664" y="313.3" font-size="15"><tspan x="664" dy="0">A stock Hugging Face recipe</tspan><tspan x="664" dy="20.4">for training soft prompts on</tspan><tspan x="664" dy="20.4">the Falcon-E model gave</tspan><tspan x="664" dy="20.4">outputs wrong by about 300</tspan><tspan x="664" dy="20.4">times on one real layer, as</tspan><tspan x="664" dy="20.4">measured by us. The claim</tspan><tspan x="664" dy="20.4">that a stock library runs on</tspan><tspan x="664" dy="20.4">a free T4 GPU in 2 to 5 hours</tspan><tspan x="664" dy="20.4">is marked refuted on a</tspan><tspan x="664" dy="20.4">documented hardware</tspan><tspan x="664" dy="20.4">requirement; we did not run</tspan><tspan x="664" dy="20.4">it on a T4.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">Several widely</tspan><tspan x="970" dy="22.1">repeated recipe</tspan><tspan x="970" dy="22.1">claims failed when</tspan><tspan x="970" dy="22.1">checked: one by</tspan><tspan x="970" dy="22.1">measurement, one from</tspan><tspan x="970" dy="22.1">a stated requirement.</tspan><tspan x="970" dy="22.1">It is our environment</tspan><tspan x="970" dy="22.1">and one set of</tspan><tspan x="970" dy="22.1">library versions, not</tspan><tspan x="970" dy="22.1">proof they fail</tspan><tspan x="970" dy="22.1">everywhere.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/refuted-literature-claims/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
