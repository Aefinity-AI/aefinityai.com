<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Claims from the literature that failed when we ran them: the test explained in one picture"><title>Claims from the literature that failed when we ran them: the test explained in one picture</title><desc>Question: Do published recipes for training small ternary models work as claimed on ordinary hardware? How we tested: 1. Record each cited recipe as refuted, corrected or surviving. 2. Run it on our target machine where we can. 3. Where we cannot, say so and cite the stated requirement. What we found (Negative): 2 recipe claims refuted. A stock Hugging Face recipe for training soft prompts on the Falcon-E model gave outputs wrong by about 300 times on one real layer, as measured by us. The claim that a stock library runs on a free T4 GPU in 2 to 5 hours is marked refuted on a documented hardware requirement; we did not run it on a T4. What it means: Several widely repeated recipe claims failed when checked: one by measurement, one from a stated requirement. It is our environment and one set of library versions, not proof they fail everywhere.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-negative);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
