<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="CIS-2: the same AI output, bit for bit, on different machines: the test explained in one picture"><title>CIS-2: the same AI output, bit for bit, on different machines: the test explained in one picture</title><desc>Question: Can different computers produce exactly the same AI output, bit for bit, from a written specification? How we tested: 1. Write the arithmetic down: order of additions, no fused multiply-add, fixed sin/cos formulas. 2. Pin one test: SmolLM2-135M, the prompt &#x27;Once upon a time&#x27;, 16 tokens, fp32. 3. Hash the full output scores into a SHA-256 chain. That digest is the receipt. 4. Run the self-check on other machines and compare with the pinned digests. What we found (Positive): 4 of 4 digests match. A free cloud machine (Xeon Platinum 8488C, not ours) matched all four pinned digests. An Android phone matched them through a different code path. The README&#x27;s expected self-check output ends 9 passed, 0 failed. What it means: With the arithmetic pinned, the bits reproduced across these machines in our own runs. It says nothing about whether the model is right, safe or fair, and no outside party has reproduced it yet.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-positive);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L01<tspan class="ex-dot" dx="10">POSITIVE</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">CIS-2: the same AI output, bit for bit, on different machines</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Can different</tspan><tspan x="38" dy="24.7">computers produce</tspan><tspan x="38" dy="24.7">exactly the same</tspan><tspan x="38" dy="24.7">AI output, bit</tspan><tspan x="38" dy="24.7">for bit, from a</tspan><tspan x="38" dy="24.7">written</tspan><tspan x="38" dy="24.7">specification?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="364.1" y2="364.1"/><text class="ex-lab" x="38" y="382.1" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="402.1" font-size="13"><tspan x="38" dy="0">If the same AI gives</tspan><tspan x="38" dy="17.6">different bits on different</tspan><tspan x="38" dy="17.6">machines, nobody can check a</tspan><tspan x="38" dy="17.6">result by re-running it. A</tspan><tspan x="38" dy="17.6">spec that makes the bits</tspan><tspan x="38" dy="17.6">identical turns &#x27;trust us&#x27;</tspan><tspan x="38" dy="17.6">into &#x27;run it yourself&#x27;.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="98.8" rx="9"/><circle class="ex-num" cx="322" cy="215.4" r="11"/><text class="ex-numt" x="322" y="219.9" font-size="13" text-anchor="middle">1</text><g transform="translate(340 204.405) scale(0.917)"><path class="ex-ic" d="M4 20l4-1 11-11-3-3L5 16z M14 7l3 3"/></g><text class="ex-t" x="372" y="191.7" font-size="14"><tspan x="372" dy="0">Write the arithmetic down:</tspan><tspan x="372" dy="18.5">order of additions, no fused</tspan><tspan x="372" dy="18.5">multiply-add, fixed sin/cos</tspan><tspan x="372" dy="18.5">formulas.</tspan></text><rect class="ex-sub" x="302" y="274.8" width="306" height="80.3" rx="9"/><circle class="ex-num" cx="322" cy="315.0" r="11"/><text class="ex-numt" x="322" y="319.5" font-size="13" text-anchor="middle">2</text><g transform="translate(340 303.975) scale(0.917)"><path class="ex-ic" d="M6 21V4 M6 4h12l-3 4 3 4H6"/></g><text class="ex-t" x="372" y="300.6" font-size="14"><tspan x="372" dy="0">Pin one test: SmolLM2-135M,</tspan><tspan x="372" dy="18.5">the prompt &#x27;Once upon a</tspan><tspan x="372" dy="18.5">time&#x27;, 16 tokens, fp32.</tspan></text><rect class="ex-sub" x="302" y="365.1" width="306" height="80.3" rx="9"/><circle class="ex-num" cx="322" cy="405.3" r="11"/><text class="ex-numt" x="322" y="409.8" font-size="13" text-anchor="middle">3</text><g transform="translate(340 394.30499999999995) scale(0.917)"><path class="ex-ic" d="M9 4L7 20 M17 4l-2 16 M4 9h17 M3 15h17"/></g><text class="ex-t" x="372" y="390.9" font-size="14"><tspan x="372" dy="0">Hash the full output scores</tspan><tspan x="372" dy="18.5">into a SHA-256 chain. That</tspan><tspan x="372" dy="18.5">digest is the receipt.</tspan></text><rect class="ex-sub" x="302" y="455.5" width="306" height="80.3" rx="9"/><circle class="ex-num" cx="322" cy="495.6" r="11"/><text class="ex-numt" x="322" y="500.1" font-size="13" text-anchor="middle">4</text><g transform="translate(340 484.635) scale(0.917)"><path class="ex-ic" d="M4 8h13 M14 5l3 3-3 3 M20 16H7 M10 13l-3 3 3 3"/></g><text class="ex-t" x="372" y="481.2" font-size="14"><tspan x="372" dy="0">Run the self-check on other</tspan><tspan x="372" dy="18.5">machines and compare with the</tspan><tspan x="372" dy="18.5">pinned digests.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="96" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">POSITIVE</text><text class="ex-head" x="664" y="229.5" font-size="30"><tspan x="664" dy="0">4 of 4</tspan><tspan x="664" dy="33.6">digests match</tspan></text><text class="ex-t" x="664" y="319.4" font-size="15"><tspan x="664" dy="0">A free cloud machine (Xeon</tspan><tspan x="664" dy="20.4">Platinum 8488C, not ours)</tspan><tspan x="664" dy="20.4">matched all four pinned</tspan><tspan x="664" dy="20.4">digests. An Android phone</tspan><tspan x="664" dy="20.4">matched them through a</tspan><tspan x="664" dy="20.4">different code path. The</tspan><tspan x="664" dy="20.4">README&#x27;s expected self-check</tspan><tspan x="664" dy="20.4">output ends 9 passed, 0</tspan><tspan x="664" dy="20.4">failed.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">With the arithmetic</tspan><tspan x="970" dy="22.1">pinned, the bits</tspan><tspan x="970" dy="22.1">reproduced across</tspan><tspan x="970" dy="22.1">these machines in our</tspan><tspan x="970" dy="22.1">own runs. It says</tspan><tspan x="970" dy="22.1">nothing about whether</tspan><tspan x="970" dy="22.1">the model is right,</tspan><tspan x="970" dy="22.1">safe or fair, and no</tspan><tspan x="970" dy="22.1">outside party has</tspan><tspan x="970" dy="22.1">reproduced it yet.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like a recipe that fixes the oven settings and the order of every step, so every oven bakes the same cake, crumb for crumb.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/cis2-cross-machine-digest/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
