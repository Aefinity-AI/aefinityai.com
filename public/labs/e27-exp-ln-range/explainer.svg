<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="E27: exp, ln and SiLU on every float32 input, and a defect in our spec: the test explained in one picture"><title>E27: exp, ln and SiLU on every float32 input, and a defect in our spec: the test explained in one picture</title><desc>Question: Is the pinned exponential accurate on every possible input, and are the spec&#x27;s safety guards correct? How we tested: 1. Evaluate exp, ln and SiLU on all 2^32 float32 bit patterns. 2. Compare against a float64 reference and run checks that need no reference. 3. Re-run on a second machine. What we found (Mixed): Within 1 ULP; one spec defect. All 3,257,925,634 inputs where both values are finite were within one ULP (max relative error 1.1921e-7); exp and ln were monotone with zero violations. The headline is a defect in our spec: the high guard (x &gt; 88.0 returns infinity) clips 94,743 inputs whose true exp is finite. An erratum was filed. What it means: Exhaustive testing found a real defect in our own spec that sampling could not. The clipped range was entered 0 times in the instrumented decode, but other models and prompts were not ruled out.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-mixed);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L17<tspan class="ex-dot" dx="10">MIXED</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">E27: exp, ln and SiLU on every float32 input, and a defect in our spec</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Is the pinned</tspan><tspan x="38" dy="24.7">exponential</tspan><tspan x="38" dy="24.7">accurate on every</tspan><tspan x="38" dy="24.7">possible input,</tspan><tspan x="38" dy="24.7">and are the</tspan><tspan x="38" dy="24.7">spec&#x27;s safety</tspan><tspan x="38" dy="24.7">guards correct?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="364.1" y2="364.1"/><text class="ex-lab" x="38" y="382.1" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="402.1" font-size="14"><tspan x="38" dy="0">The softmax inside every</tspan><tspan x="38" dy="18.9">transformer uses exp. If</tspan><tspan x="38" dy="18.9">its guards are wrong the</tspan><tspan x="38" dy="18.9">spec pins a wrong answer</tspan><tspan x="38" dy="18.9">exactly.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="212.7" r="11"/><text class="ex-numt" x="322" y="217.2" font-size="13" text-anchor="middle">1</text><g transform="translate(340 201.72) scale(0.917)"><path class="ex-ic" d="M5 5v14 M10 5v14 M15 5v14 M3 17L21 7"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Evaluate exp, ln and SiLU on</tspan><tspan x="372" dy="18.5">all 2^32 float32 bit</tspan><tspan x="372" dy="18.5">patterns.</tspan></text><rect class="ex-sub" x="302" y="269.4" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="316.2" r="11"/><text class="ex-numt" x="322" y="320.7" font-size="13" text-anchor="middle">2</text><g transform="translate(340 305.15999999999997) scale(0.917)"><path class="ex-ic" d="M4 8h13 M14 5l3 3-3 3 M20 16H7 M10 13l-3 3 3 3"/></g><text class="ex-t" x="372" y="301.7" font-size="14"><tspan x="372" dy="0">Compare against a float64</tspan><tspan x="372" dy="18.5">reference and run checks that</tspan><tspan x="372" dy="18.5">need no reference.</tspan></text><rect class="ex-sub" x="302" y="372.9" width="306" height="66.0" rx="9"/><circle class="ex-num" cx="322" cy="405.9" r="11"/><text class="ex-numt" x="322" y="410.4" font-size="13" text-anchor="middle">3</text><g transform="translate(340 394.88) scale(0.917)"><path class="ex-ic" d="M4 12a8 8 0 0 1 14-5 M18 3v4h-4 M20 12a8 8 0 0 1-14 5 M6 21v-4h4"/></g><text class="ex-t" x="372" y="409.9" font-size="14"><tspan x="372" dy="0">Re-run on a second machine.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="74" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">MIXED</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">Within 1 ULP;</tspan><tspan x="664" dy="31.4">one spec</tspan><tspan x="664" dy="31.4">defect</tspan></text><text class="ex-t" x="664" y="342.9" font-size="13"><tspan x="664" dy="0">All 3,257,925,634 inputs where</tspan><tspan x="664" dy="17.7">both values are finite were within</tspan><tspan x="664" dy="17.7">one ULP (max relative error</tspan><tspan x="664" dy="17.7">1.1921e-7); exp and ln were</tspan><tspan x="664" dy="17.7">monotone with zero violations. The</tspan><tspan x="664" dy="17.7">headline is a defect in our spec:</tspan><tspan x="664" dy="17.7">the high guard (x &gt; 88.0 returns</tspan><tspan x="664" dy="17.7">infinity) clips 94,743 inputs</tspan><tspan x="664" dy="17.7">whose true exp is finite. An</tspan><tspan x="664" dy="17.7">erratum was filed.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">Exhaustive testing</tspan><tspan x="970" dy="22.1">found a real defect</tspan><tspan x="970" dy="22.1">in our own spec that</tspan><tspan x="970" dy="22.1">sampling could not.</tspan><tspan x="970" dy="22.1">The clipped range was</tspan><tspan x="970" dy="22.1">entered 0 times in</tspan><tspan x="970" dy="22.1">the instrumented</tspan><tspan x="970" dy="22.1">decode, but other</tspan><tspan x="970" dy="22.1">models and prompts</tspan><tspan x="970" dy="22.1">were not ruled out.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like testing every light switch in a building: that is how the one wired backwards gets found.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/e27-exp-ln-range/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
