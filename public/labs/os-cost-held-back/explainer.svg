<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="What does an operating system cost? A pre-registered result we held back: the test explained in one picture"><title>What does an operating system cost? A pre-registered result we held back: the test explained in one picture</title><desc>Question: Is running AI with no operating system at all faster than a minimal Linux on the same laptop? How we tested: 1. Pre-register a comparison of a no-OS build against a minimal Linux on one laptop. 2. Run it. The first result surprised us. 3. Apply the pre-registered rule: a surprising result is not published until its cause is understood. 4. Look for the mechanism. We found one contributing cause in our own build; the question stays open. What we found (Held back): Held back. No numbers from this comparison are published. They will be published when the mechanism is understood. What it means: This shows a rule written in advance doing its job. It says nothing about what an operating system costs, or about speed.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-held);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L29<tspan class="ex-dot" dx="10">HELD BACK</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">What does an operating system cost? A pre-registered result we held back</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Is running AI</tspan><tspan x="38" dy="24.7">with no operating</tspan><tspan x="38" dy="24.7">system at all</tspan><tspan x="38" dy="24.7">faster than a</tspan><tspan x="38" dy="24.7">minimal Linux on</tspan><tspan x="38" dy="24.7">the same laptop?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="339.4" y2="339.4"/><text class="ex-lab" x="38" y="357.4" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="377.4" font-size="14"><tspan x="38" dy="0">A surprising result should</tspan><tspan x="38" dy="18.9">be explained before it is</tspan><tspan x="38" dy="18.9">published.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="80.3" rx="9"/><circle class="ex-num" cx="322" cy="206.2" r="11"/><text class="ex-numt" x="322" y="210.7" font-size="13" text-anchor="middle">1</text><g transform="translate(340 195.165) scale(0.917)"><path class="ex-ic" d="M6 21V4 M6 4h12l-3 4 3 4H6"/></g><text class="ex-t" x="372" y="191.7" font-size="14"><tspan x="372" dy="0">Pre-register a comparison of</tspan><tspan x="372" dy="18.5">a no-OS build against a</tspan><tspan x="372" dy="18.5">minimal Linux on one laptop.</tspan></text><rect class="ex-sub" x="302" y="256.3" width="306" height="61.8" rx="9"/><circle class="ex-num" cx="322" cy="287.3" r="11"/><text class="ex-numt" x="322" y="291.8" font-size="13" text-anchor="middle">2</text><g transform="translate(340 276.255) scale(0.917)"><path class="ex-ic" d="M8 5l11 7-11 7z"/></g><text class="ex-t" x="372" y="282.1" font-size="14"><tspan x="372" dy="0">Run it. The first result</tspan><tspan x="372" dy="18.5">surprised us.</tspan></text><rect class="ex-sub" x="302" y="328.2" width="306" height="98.8" rx="9"/><circle class="ex-num" cx="322" cy="377.6" r="11"/><text class="ex-numt" x="322" y="382.1" font-size="13" text-anchor="middle">3</text><g transform="translate(340 366.5849999999999) scale(0.917)"><path class="ex-ic" d="M6 11h12v9H6z M8 11V8a4 4 0 0 1 8 0v3"/></g><text class="ex-t" x="372" y="353.9" font-size="14"><tspan x="372" dy="0">Apply the pre-registered</tspan><tspan x="372" dy="18.5">rule: a surprising result is</tspan><tspan x="372" dy="18.5">not published until its cause</tspan><tspan x="372" dy="18.5">is understood.</tspan></text><rect class="ex-sub" x="302" y="437.0" width="306" height="98.8" rx="9"/><circle class="ex-num" cx="322" cy="486.4" r="11"/><text class="ex-numt" x="322" y="490.9" font-size="13" text-anchor="middle">4</text><g transform="translate(340 475.3949999999999) scale(0.917)"><path class="ex-ic" d="M10 4a6 6 0 1 0 0 12a6 6 0 0 0 0-12z M14.5 14.5L20 20"/></g><text class="ex-t" x="372" y="462.7" font-size="14"><tspan x="372" dy="0">Look for the mechanism. We</tspan><tspan x="372" dy="18.5">found one contributing cause</tspan><tspan x="372" dy="18.5">in our own build; the</tspan><tspan x="372" dy="18.5">question stays open.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="104" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">HELD BACK</text><text class="ex-head" x="664" y="229.5" font-size="30"><tspan x="664" dy="0">Held back</tspan></text><text class="ex-t" x="664" y="285.9" font-size="15"><tspan x="664" dy="0">No numbers from this</tspan><tspan x="664" dy="20.4">comparison are published.</tspan><tspan x="664" dy="20.4">They will be published when</tspan><tspan x="664" dy="20.4">the mechanism is understood.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">This shows a rule</tspan><tspan x="970" dy="22.1">written in advance</tspan><tspan x="970" dy="22.1">doing its job. It</tspan><tspan x="970" dy="22.1">says nothing about</tspan><tspan x="970" dy="22.1">what an operating</tspan><tspan x="970" dy="22.1">system costs, or</tspan><tspan x="970" dy="22.1">about speed.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like a referee who will not announce a score until the clock is fixed.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/os-cost-held-back/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
