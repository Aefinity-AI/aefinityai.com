<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="E28, E36, E37: every internal activation compared against an independent implementation: the test explained in one picture"><title>E28, E36, E37: every internal activation compared against an independent implementation: the test explained in one picture</title><desc>Question: Could errors inside the model cancel out, so the final answer looks right while the inside is wrong? How we tested: 1. Feed the same token ids to our verifier and to a Hugging Face transformers fp32 pass. 2. Compare every intermediate tensor. 3. Start with one prompt, then widen to six prompt cells on each of two models. What we found (Positive): 144,825 tensors compared. The widened runs compared 144,825 tensors across two models. The single-prompt worst disagreement was 9.9e-5 (Qwen). Widening corrected our own published SmolLM2 worst case to 3.406e-05, which is 1.53 times the number we first published. What it means: Agreement is to about 1e-5 relative (up to 1e-4 on Qwen), not bit-exact, because the comparison uses a different implementation on purpose. A maximum from one input is only that input&#x27;s maximum.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-positive);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
