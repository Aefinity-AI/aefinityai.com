.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L18<tspan class="ex-dot" dx="10">POSITIVE</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">E28, E36, E37: every internal activation compared against an independent</tspan><tspan x="24" dy="30.0">implementation</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Could errors</tspan><tspan x="38" dy="24.7">inside the model</tspan><tspan x="38" dy="24.7">cancel out, so</tspan><tspan x="38" dy="24.7">the final answer</tspan><tspan x="38" dy="24.7">looks right while</tspan><tspan x="38" dy="24.7">the inside is</tspan><tspan x="38" dy="24.7">wrong?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="364.1" y2="364.1"/><text class="ex-lab" x="38" y="382.1" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="402.1" font-size="14"><tspan x="38" dy="0">Errors inside a model</tspan><tspan x="38" dy="18.9">could cancel, so the final</tspan><tspan x="38" dy="18.9">answer looks right while</tspan><tspan x="38" dy="18.9">the middle is wrong.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="212.7" r="11"/><text class="ex-numt" x="322" y="217.2" font-size="13" text-anchor="middle">1</text><g transform="translate(340 201.72) scale(0.917)"><path class="ex-ic" d="M8 5l11 7-11 7z"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Feed the same token ids to</tspan><tspan x="372" dy="18.5">our verifier and to a Hugging</tspan><tspan x="372" dy="18.5">Face transformers fp32 pass.</tspan></text><rect class="ex-sub" x="302" y="269.4" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="306.9" r="11"/><text class="ex-numt" x="322" y="311.4" font-size="13" text-anchor="middle">2</text><g transform="translate(340 295.92) scale(0.917)"><path class="ex-ic" d="M4 8h13 M14 5l3 3-3 3 M20 16H7 M10 13l-3 3 3 3"/></g><text class="ex-t" x="372" y="301.7" font-size="14"><tspan x="372" dy="0">Compare every intermediate</tspan><tspan x="372" dy="18.5">tensor.</tspan></text><rect class="ex-sub" x="302" y="354.4" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="401.1" r="11"/><text class="ex-numt" x="322" y="405.6" font-size="13" text-anchor="middle">3</text><g transform="translate(340 390.12) scale(0.917)"><path class="ex-ic" d="M9 6h11 M9 12h11 M9 18h11 M4 6h.5 M4 12h.5 M4 18h.5"/></g><text class="ex-t" x="372" y="386.7" font-size="14"><tspan x="372" dy="0">Start with one prompt, then</tspan><tspan x="372" dy="18.5">widen to six prompt cells on</tspan><tspan x="372" dy="18.5">each of two models.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="96" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">POSITIVE</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">144,825</tspan><tspan x="664" dy="31.4">tensors</tspan><tspan x="664" dy="31.4">compared</tspan></text><text class="ex-t" x="664" y="344.6" font-size="15"><tspan x="664" dy="0">The widened runs compared</tspan><tspan x="664" dy="20.4">144,825 tensors across two</tspan><tspan x="664" dy="20.4">models. The single-prompt</tspan><tspan x="664" dy="20.4">worst disagreement was 9.9e-5</tspan><tspan x="664" dy="20.4">(Qwen). Widening corrected</tspan><tspan x="664" dy="20.4">our own published SmolLM2</tspan><tspan x="664" dy="20.4">worst case to 3.406e-05,</tspan><tspan x="664" dy="20.4">which is 1.53 times the</tspan><tspan x="664" dy="20.4">number we first published.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">Agreement is to about</tspan><tspan x="970" dy="22.1">1e-5 relative (up to</tspan><tspan x="970" dy="22.1">1e-4 on Qwen), not</tspan><tspan x="970" dy="22.1">bit-exact, because</tspan><tspan x="970" dy="22.1">the comparison uses a</tspan><tspan x="970" dy="22.1">different</tspan><tspan x="970" dy="22.1">implementation on</tspan><tspan x="970" dy="22.1">purpose. A maximum</tspan><tspan x="970" dy="22.1">from one input is</tspan><tspan x="970" dy="22.1">only that input&#x27;s</tspan><tspan x="970" dy="22.1">maximum.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like checking every line of a sum against a second person&#x27;s working, not only the final total.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/layer-oracle-e28-e36-e37/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
