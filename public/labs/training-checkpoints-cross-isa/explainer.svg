.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L12<tspan class="ex-dot" dx="10">MIXED</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">Training checkpoints across CPUs and instruction sets</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">If you run the</tspan><tspan x="38" dy="24.7">same training job</tspan><tspan x="38" dy="24.7">with the same</tspan><tspan x="38" dy="24.7">seed on two</tspan><tspan x="38" dy="24.7">computers, do you</tspan><tspan x="38" dy="24.7">get the same</tspan><tspan x="38" dy="24.7">model?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="364.1" y2="364.1"/><text class="ex-lab" x="38" y="382.1" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="402.1" font-size="14"><tspan x="38" dy="0">If the same training job</tspan><tspan x="38" dy="18.9">gives different checkpoint</tspan><tspan x="38" dy="18.9">bytes on different</tspan><tspan x="38" dy="18.9">computers, a trained model</tspan><tspan x="38" dy="18.9">cannot be reproduced from</tspan><tspan x="38" dy="18.9">its recipe.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="103.4" rx="9"/><circle class="ex-num" cx="322" cy="217.7" r="11"/><text class="ex-numt" x="322" y="222.2" font-size="13" text-anchor="middle">1</text><g transform="translate(340 206.715) scale(0.917)"><path class="ex-ic" d="M9 4L7 20 M17 4l-2 16 M4 9h17 M3 15h17"/></g><text class="ex-t" x="372" y="194.1" font-size="14"><tspan x="372" dy="0">Train a tiny language model</tspan><tspan x="372" dy="18.5">with a fixed seed; hash the</tspan><tspan x="372" dy="18.5">raw parameter bytes at steps</tspan><tspan x="372" dy="18.5">50, 100, 150, 200.</tspan></text><rect class="ex-sub" x="302" y="279.4" width="306" height="66.5" rx="9"/><circle class="ex-num" cx="322" cy="312.7" r="11"/><text class="ex-numt" x="322" y="317.2" font-size="13" text-anchor="middle">2</text><g transform="translate(340 301.665) scale(0.917)"><path class="ex-ic" d="M7 7h10v10H7z M10 3v4 M14 3v4 M10 17v4 M14 17v4 M3 10h4 M3 14h4 M17 10h4 M17 14h4"/></g><text class="ex-t" x="372" y="307.5" font-size="14"><tspan x="372" dy="0">Run default PyTorch on a CPU</tspan><tspan x="372" dy="18.5">with AVX2 and one without.</tspan></text><rect class="ex-sub" x="302" y="355.9" width="306" height="84.9" rx="9"/><circle class="ex-num" cx="322" cy="398.4" r="11"/><text class="ex-numt" x="322" y="402.9" font-size="13" text-anchor="middle">3</text><g transform="translate(340 387.375) scale(0.917)"><path class="ex-ic" d="M14.5 4a4.5 4.5 0 0 0-4 6.3L4 16.8 7.2 20l6.5-6.5A4.5 4.5 0 0 0 20 9.5l-3 3-3-1-1-3 3-3z"/></g><text class="ex-t" x="372" y="384.0" font-size="14"><tspan x="372" dy="0">Run PyTorch again with the</tspan><tspan x="372" dy="18.5">CPU kernel and thread count</tspan><tspan x="372" dy="18.5">pinned.</tspan></text><rect class="ex-sub" x="302" y="450.8" width="306" height="84.9" rx="9"/><circle class="ex-num" cx="322" cy="493.3" r="11"/><text class="ex-numt" x="322" y="497.8" font-size="13" text-anchor="middle">4</text><g transform="translate(340 482.32499999999993) scale(0.917)"><path class="ex-ic" d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/></g><text class="ex-t" x="372" y="478.9" font-size="14"><tspan x="372" dy="0">Run a from-scratch</tspan><tspan x="372" dy="18.5">fixed-order C trainer (13,088</tspan><tspan x="372" dy="18.5">parameters) on five hosts.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="74" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">MIXED</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">Default</tspan><tspan x="664" dy="31.4">differs; fixed</tspan><tspan x="664" dy="31.4">order matches</tspan></text><text class="ex-t" x="664" y="343.8" font-size="14"><tspan x="664" dy="0">With default PyTorch the</tspan><tspan x="664" dy="19.0">printed losses were identical</tspan><tspan x="664" dy="19.0">but every checkpoint hash</tspan><tspan x="664" dy="19.0">differed between the two CPUs</tspan><tspan x="664" dy="19.0">from step 50. With kernel and</tspan><tspan x="664" dy="19.0">threads pinned, two x86_64</tspan><tspan x="664" dy="19.0">machines matched byte for byte.</tspan><tspan x="664" dy="19.0">The fixed-order C trainer</tspan><tspan x="664" dy="19.0">matched on all five hosts,</tspan><tspan x="664" dy="19.0">including an aarch64 phone.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">Matching printed</tspan><tspan x="970" dy="22.1">numbers can hide</tspan><tspan x="970" dy="22.1">different bytes; only</tspan><tspan x="970" dy="22.1">hashing the raw bytes</tspan><tspan x="970" dy="22.1">shows it. Toy scale</tspan><tspan x="970" dy="22.1">only: 13,088</tspan><tspan x="970" dy="22.1">parameters, CPU only,</tspan><tspan x="970" dy="22.1">our own hosts, one</tspan><tspan x="970" dy="22.1">run per setup.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like two calculators that show the same rounded answer while holding different digits underneath.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/training-checkpoints-cross-isa/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
