<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Training checkpoints across CPUs and instruction sets: the test explained in one picture"><title>Training checkpoints across CPUs and instruction sets: the test explained in one picture</title><desc>Question: If you run the same training job with the same seed on two computers, do you get the same model? How we tested: 1. Train a tiny language model with a fixed seed; hash the raw parameter bytes at steps 50, 100, 150, 200. 2. Run default PyTorch on a CPU with AVX2 and one without. 3. Run PyTorch again with the CPU kernel and thread count pinned. 4. Run a from-scratch fixed-order C trainer (13,088 parameters) on five hosts. What we found (Mixed): Default differs; fixed order matches. With default PyTorch the printed losses were identical but every checkpoint hash differed between the two CPUs from step 50. With kernel and threads pinned, two x86_64 machines matched byte for byte. The fixed-order C trainer matched on all five hosts, including an aarch64 phone. What it means: Matching printed numbers can hide different bytes; only hashing the raw bytes shows it. Toy scale only: 13,088 parameters, CPU only, our own hosts, one run per setup.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-mixed);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
