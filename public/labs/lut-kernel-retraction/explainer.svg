<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The &#x27;16% slower&#x27; lookup-table kernel claim, retracted: the test explained in one picture"><title>The &#x27;16% slower&#x27; lookup-table kernel claim, retracted: the test explained in one picture</title><desc>Question: Does a performance number copied from a source comment hold up when actually measured? How we tested: 1. Put all candidates in one program and interleave them in one loop on identical packed weights. 2. Make three logged runs. 3. Compare the f32 arm with the lookup-table (pshufb) arm. What we found (Negative): &#x27;16% slower&#x27; did not reproduce. The lookup-table arm swung 36% between two speed modes while the f32 arm moved 4.7%. In the faster mode it was 1.19 to 1.21 times faster than f32; in run 1 it lost at 1.09x, so the ordering flips between runs. The reject decision stands on memory traffic (a derived ~28% slower decode, not a measurement). What it means: A number that was copied and never measured was wrong in the form claimed; the conclusion survived for a different reason. Three runs on a virtual machine, no end-to-end measurement.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-negative);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L30<tspan class="ex-dot" dx="10">NEGATIVE</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">The &#x27;16% slower&#x27; lookup-table kernel claim, retracted</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Does a</tspan><tspan x="38" dy="24.7">performance</tspan><tspan x="38" dy="24.7">number copied</tspan><tspan x="38" dy="24.7">from a source</tspan><tspan x="38" dy="24.7">comment hold up</tspan><tspan x="38" dy="24.7">when actually</tspan><tspan x="38" dy="24.7">measured?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="364.1" y2="364.1"/><text class="ex-lab" x="38" y="382.1" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="402.1" font-size="14"><tspan x="38" dy="0">Numbers that were never</tspan><tspan x="38" dy="18.9">measured spread easily.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="111.9" rx="9"/><circle class="ex-num" cx="322" cy="222.0" r="11"/><text class="ex-numt" x="322" y="226.5" font-size="13" text-anchor="middle">1</text><g transform="translate(340 210.96) scale(0.917)"><path class="ex-ic" d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Put all candidates in one</tspan><tspan x="372" dy="18.5">program and interleave them</tspan><tspan x="372" dy="18.5">in one loop on identical</tspan><tspan x="372" dy="18.5">packed weights.</tspan></text><rect class="ex-sub" x="302" y="287.9" width="306" height="66.0" rx="9"/><circle class="ex-num" cx="322" cy="320.9" r="11"/><text class="ex-numt" x="322" y="325.4" font-size="13" text-anchor="middle">2</text><g transform="translate(340 309.92) scale(0.917)"><path class="ex-ic" d="M4 12a8 8 0 0 1 14-5 M18 3v4h-4 M20 12a8 8 0 0 1-14 5 M6 21v-4h4"/></g><text class="ex-t" x="372" y="325.0" font-size="14"><tspan x="372" dy="0">Make three logged runs.</tspan></text><rect class="ex-sub" x="302" y="363.9" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="401.4" r="11"/><text class="ex-numt" x="322" y="405.9" font-size="13" text-anchor="middle">3</text><g transform="translate(340 390.40000000000003) scale(0.917)"><path class="ex-ic" d="M4 8h13 M14 5l3 3-3 3 M20 16H7 M10 13l-3 3 3 3"/></g><text class="ex-t" x="372" y="396.2" font-size="14"><tspan x="372" dy="0">Compare the f32 arm with the</tspan><tspan x="372" dy="18.5">lookup-table (pshufb) arm.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="96" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">NEGATIVE</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">&#x27;16% slower&#x27;</tspan><tspan x="664" dy="31.4">did not</tspan><tspan x="664" dy="31.4">reproduce</tspan></text><text class="ex-t" x="664" y="343.4" font-size="13.5"><tspan x="664" dy="0">The lookup-table arm swung 36%</tspan><tspan x="664" dy="18.4">between two speed modes while</tspan><tspan x="664" dy="18.4">the f32 arm moved 4.7%. In the</tspan><tspan x="664" dy="18.4">faster mode it was 1.19 to 1.21</tspan><tspan x="664" dy="18.4">times faster than f32; in run 1</tspan><tspan x="664" dy="18.4">it lost at 1.09x, so the</tspan><tspan x="664" dy="18.4">ordering flips between runs. The</tspan><tspan x="664" dy="18.4">reject decision stands on memory</tspan><tspan x="664" dy="18.4">traffic (a derived ~28% slower</tspan><tspan x="664" dy="18.4">decode, not a measurement).</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">A number that was</tspan><tspan x="970" dy="22.1">copied and never</tspan><tspan x="970" dy="22.1">measured was wrong in</tspan><tspan x="970" dy="22.1">the form claimed; the</tspan><tspan x="970" dy="22.1">conclusion survived</tspan><tspan x="970" dy="22.1">for a different</tspan><tspan x="970" dy="22.1">reason. Three runs on</tspan><tspan x="970" dy="22.1">a virtual machine, no</tspan><tspan x="970" dy="22.1">end-to-end</tspan><tspan x="970" dy="22.1">measurement.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like repeating a rumour that a road is slow, then timing it three times and finding the answer flips from run to run.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/lut-kernel-retraction/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
