<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An NVIDIA GPU reproduces the CPU reference digest (Tesla P100): the test explained in one picture"><title>An NVIDIA GPU reproduces the CPU reference digest (Tesla P100): the test explained in one picture</title><desc>Question: Does the same AI output come out bit for bit on a graphics card, not just on other CPUs? How we tested: 1. Write an independent CUDA version of the same spec. 2. Run the four test vectors on a Kaggle Tesla P100 with the internet off. 3. Compare the GPU digests with the CPU digests. 4. Sample GPU use and read the compiled code to prove the work ran on the GPU. What we found (Positive): 4 of 4 vectors match. All four vectors matched the CPU digests on the GPU (Tesla P100, run of 2026-09-08). Two earlier GPU runs were false positives, because the program had really been built for the CPU, and we withdrew them. What it means: The bits reproduce on one older GPU generation. It says nothing about speed or newer GPUs, and our CUDA code is not public, so outsiders cannot rerun our port.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-positive);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L02<tspan class="ex-dot" dx="10">POSITIVE</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">An NVIDIA GPU reproduces the CPU reference digest (Tesla P100)</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="476" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="476" rx="12"/><path class="ex-chev" d="M274.0 352.0l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="476" rx="12"/><path class="ex-chev" d="M630.0 352.0l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="476" rx="12"/><path class="ex-chev" d="M940.0 352.0l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Does the same AI</tspan><tspan x="38" dy="24.7">output come out</tspan><tspan x="38" dy="24.7">bit for bit on a</tspan><tspan x="38" dy="24.7">graphics card,</tspan><tspan x="38" dy="24.7">not just on other</tspan><tspan x="38" dy="24.7">CPUs?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="339.4" y2="339.4"/><text class="ex-lab" x="38" y="357.4" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="377.4" font-size="14"><tspan x="38" dy="0">Most AI runs on graphics</tspan><tspan x="38" dy="18.9">cards. A claim that only</tspan><tspan x="38" dy="18.9">holds on CPUs would miss</tspan><tspan x="38" dy="18.9">where the work is done.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="203.5" r="11"/><text class="ex-numt" x="322" y="208.0" font-size="13" text-anchor="middle">1</text><g transform="translate(340 192.48000000000002) scale(0.917)"><path class="ex-ic" d="M4 20l4-1 11-11-3-3L5 16z M14 7l3 3"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Write an independent CUDA</tspan><tspan x="372" dy="18.5">version of the same spec.</tspan></text><rect class="ex-sub" x="302" y="251.0" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="297.7" r="11"/><text class="ex-numt" x="322" y="302.2" font-size="13" text-anchor="middle">2</text><g transform="translate(340 286.68) scale(0.917)"><path class="ex-ic" d="M8 5l11 7-11 7z"/></g><text class="ex-t" x="372" y="283.3" font-size="14"><tspan x="372" dy="0">Run the four test vectors on</tspan><tspan x="372" dy="18.5">a Kaggle Tesla P100 with the</tspan><tspan x="372" dy="18.5">internet off.</tspan></text><rect class="ex-sub" x="302" y="354.4" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="391.9" r="11"/><text class="ex-numt" x="322" y="396.4" font-size="13" text-anchor="middle">3</text><g transform="translate(340 380.88) scale(0.917)"><path class="ex-ic" d="M4 8h13 M14 5l3 3-3 3 M20 16H7 M10 13l-3 3 3 3"/></g><text class="ex-t" x="372" y="386.7" font-size="14"><tspan x="372" dy="0">Compare the GPU digests with</tspan><tspan x="372" dy="18.5">the CPU digests.</tspan></text><rect class="ex-sub" x="302" y="439.4" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="486.1" r="11"/><text class="ex-numt" x="322" y="490.6" font-size="13" text-anchor="middle">4</text><g transform="translate(340 475.08000000000004) scale(0.917)"><path class="ex-ic" d="M10 4a6 6 0 1 0 0 12a6 6 0 0 0 0-12z M14.5 14.5L20 20"/></g><text class="ex-t" x="372" y="471.7" font-size="14"><tspan x="372" dy="0">Sample GPU use and read the</tspan><tspan x="372" dy="18.5">compiled code to prove the</tspan><tspan x="372" dy="18.5">work ran on the GPU.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="440" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="96" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">POSITIVE</text><text class="ex-head" x="664" y="229.5" font-size="30"><tspan x="664" dy="0">4 of 4</tspan><tspan x="664" dy="33.6">vectors match</tspan></text><text class="ex-t" x="664" y="319.4" font-size="15"><tspan x="664" dy="0">All four vectors matched the</tspan><tspan x="664" dy="20.4">CPU digests on the GPU (Tesla</tspan><tspan x="664" dy="20.4">P100, run of 2026-09-08). Two</tspan><tspan x="664" dy="20.4">earlier GPU runs were false</tspan><tspan x="664" dy="20.4">positives, because the</tspan><tspan x="664" dy="20.4">program had really been built</tspan><tspan x="664" dy="20.4">for the CPU, and we withdrew</tspan><tspan x="664" dy="20.4">them.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">The bits reproduce on</tspan><tspan x="970" dy="22.1">one older GPU</tspan><tspan x="970" dy="22.1">generation. It says</tspan><tspan x="970" dy="22.1">nothing about speed</tspan><tspan x="970" dy="22.1">or newer GPUs, and</tspan><tspan x="970" dy="22.1">our CUDA code is not</tspan><tspan x="970" dy="22.1">public, so outsiders</tspan><tspan x="970" dy="22.1">cannot rerun our</tspan><tspan x="970" dy="22.1">port.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/gpu-p100-reproduces-cpu/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
