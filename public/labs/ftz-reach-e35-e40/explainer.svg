<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="E35 to E40: does the flush-to-zero rule ever matter? (after two wrong explanations): the test explained in one picture"><title>E35 to E40: does the flush-to-zero rule ever matter? (after two wrong explanations): the test explained in one picture</title><desc>Question: Does one obscure rule about tiny numbers ever change a real AI output, and how sure can we be? How we tested: 1. Count how often tiny values arise (E35, E38). 2. Analyse exp exhaustively over all 2^32 inputs (E39). 3. Classify every reduction and normalisation intermediate (E40). What we found (Null): 0 tiny values in 562 billion. Of 562,531,070,920 intermediates classified across both pinned models, none was subnormal (a very tiny number); 0 of 628,547,776 weight values were. On the normative vector the rule does not affect the digest. Two of our earlier explanations for why were wrong and were withdrawn. What it means: No case was found where the rule changes the digest, but that holds for these two models and prompts only: on constructed inputs the rule can change bits.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-null);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
