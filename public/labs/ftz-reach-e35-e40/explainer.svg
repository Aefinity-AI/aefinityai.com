.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L20<tspan class="ex-dot" dx="10">NULL</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">E35 to E40: does the flush-to-zero rule ever matter? (after two wrong</tspan><tspan x="24" dy="30.0">explanations)</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="476" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="476" rx="12"/><path class="ex-chev" d="M274.0 352.0l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="476" rx="12"/><path class="ex-chev" d="M630.0 352.0l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="476" rx="12"/><path class="ex-chev" d="M940.0 352.0l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Does one obscure</tspan><tspan x="38" dy="24.7">rule about tiny</tspan><tspan x="38" dy="24.7">numbers ever</tspan><tspan x="38" dy="24.7">change a real AI</tspan><tspan x="38" dy="24.7">output, and how</tspan><tspan x="38" dy="24.7">sure can we be?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="339.4" y2="339.4"/><text class="ex-lab" x="38" y="357.4" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="377.4" font-size="14"><tspan x="38" dy="0">One obscure rule about</tspan><tspan x="38" dy="18.9">tiny numbers is pinned in</tspan><tspan x="38" dy="18.9">the spec. If it never</tspan><tspan x="38" dy="18.9">matters, is it needed?</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="203.5" r="11"/><text class="ex-numt" x="322" y="208.0" font-size="13" text-anchor="middle">1</text><g transform="translate(340 192.48000000000002) scale(0.917)"><path class="ex-ic" d="M5 5v14 M10 5v14 M15 5v14 M3 17L21 7"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Count how often tiny values</tspan><tspan x="372" dy="18.5">arise (E35, E38).</tspan></text><rect class="ex-sub" x="302" y="251.0" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="288.4" r="11"/><text class="ex-numt" x="322" y="292.9" font-size="13" text-anchor="middle">2</text><g transform="translate(340 277.44) scale(0.917)"><path class="ex-ic" d="M10 4a6 6 0 1 0 0 12a6 6 0 0 0 0-12z M14.5 14.5L20 20"/></g><text class="ex-t" x="372" y="283.3" font-size="14"><tspan x="372" dy="0">Analyse exp exhaustively over</tspan><tspan x="372" dy="18.5">all 2^32 inputs (E39).</tspan></text><rect class="ex-sub" x="302" y="335.9" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="382.6" r="11"/><text class="ex-numt" x="322" y="387.1" font-size="13" text-anchor="middle">3</text><g transform="translate(340 371.64) scale(0.917)"><path class="ex-ic" d="M9 6h11 M9 12h11 M9 18h11 M4 6h.5 M4 12h.5 M4 18h.5"/></g><text class="ex-t" x="372" y="368.2" font-size="14"><tspan x="372" dy="0">Classify every reduction and</tspan><tspan x="372" dy="18.5">normalisation intermediate</tspan><tspan x="372" dy="18.5">(E40).</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="440" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="66" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">NULL</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">0 tiny values</tspan><tspan x="664" dy="31.4">in 562 billion</tspan></text><text class="ex-t" x="664" y="313.3" font-size="15"><tspan x="664" dy="0">Of 562,531,070,920</tspan><tspan x="664" dy="20.4">intermediates classified</tspan><tspan x="664" dy="20.4">across both pinned models,</tspan><tspan x="664" dy="20.4">none was subnormal (a very</tspan><tspan x="664" dy="20.4">tiny number); 0 of</tspan><tspan x="664" dy="20.4">628,547,776 weight values</tspan><tspan x="664" dy="20.4">were. On the normative vector</tspan><tspan x="664" dy="20.4">the rule does not affect the</tspan><tspan x="664" dy="20.4">digest. Two of our earlier</tspan><tspan x="664" dy="20.4">explanations for why were</tspan><tspan x="664" dy="20.4">wrong and were withdrawn.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">No case was found</tspan><tspan x="970" dy="22.1">where the rule</tspan><tspan x="970" dy="22.1">changes the digest,</tspan><tspan x="970" dy="22.1">but that holds for</tspan><tspan x="970" dy="22.1">these two models and</tspan><tspan x="970" dy="22.1">prompts only: on</tspan><tspan x="970" dy="22.1">constructed inputs</tspan><tspan x="970" dy="22.1">the rule can change</tspan><tspan x="970" dy="22.1">bits.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/ftz-reach-e35-e40/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
