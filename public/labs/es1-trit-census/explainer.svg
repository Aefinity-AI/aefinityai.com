<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="E-S1: how far can a ternary 2B model be compressed without loss?: the test explained in one picture"><title>E-S1: how far can a ternary 2B model be compressed without loss?: the test explained in one picture</title><desc>Question: Can a 1.58-bit AI model be squeezed much smaller without losing anything? How we tested: 1. Count all 2,084,044,800 weights in the 210 body tensors. 2. Compress them with rANS, xz and zstd. 3. Verify the round trip byte for byte. What we found (Null): 1.532 bits per weight. The best of the lossless coders tested (zstd -19) reached 1.532 bits per weight against 2.000 for the engine&#x27;s current packing. The round trip was byte-exact with 0 mismatches. Against ideal ternary packing (1.600) the saving is about 4%. What it means: Pretrained ternary weights are close to uniform, so lossless coding gains little; real savings would need changes to the model. One model, one machine; coding speed not measured.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-null);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
