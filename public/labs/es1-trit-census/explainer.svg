.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L32<tspan class="ex-dot" dx="10">NULL</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">E-S1: how far can a ternary 2B model be compressed without loss?</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Can a 1.58-bit AI</tspan><tspan x="38" dy="24.7">model be squeezed</tspan><tspan x="38" dy="24.7">much smaller</tspan><tspan x="38" dy="24.7">without losing</tspan><tspan x="38" dy="24.7">anything?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="314.7" y2="314.7"/><text class="ex-lab" x="38" y="332.7" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="352.7" font-size="14"><tspan x="38" dy="0">Could a ternary model be</tspan><tspan x="38" dy="18.9">made much smaller without</tspan><tspan x="38" dy="18.9">losing anything?</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="212.7" r="11"/><text class="ex-numt" x="322" y="217.2" font-size="13" text-anchor="middle">1</text><g transform="translate(340 201.72) scale(0.917)"><path class="ex-ic" d="M5 5v14 M10 5v14 M15 5v14 M3 17L21 7"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Count all 2,084,044,800</tspan><tspan x="372" dy="18.5">weights in the 210 body</tspan><tspan x="372" dy="18.5">tensors.</tspan></text><rect class="ex-sub" x="302" y="269.4" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="306.9" r="11"/><text class="ex-numt" x="322" y="311.4" font-size="13" text-anchor="middle">2</text><g transform="translate(340 295.92) scale(0.917)"><path class="ex-ic" d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/></g><text class="ex-t" x="372" y="301.7" font-size="14"><tspan x="372" dy="0">Compress them with rANS, xz</tspan><tspan x="372" dy="18.5">and zstd.</tspan></text><rect class="ex-sub" x="302" y="354.4" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="391.9" r="11"/><text class="ex-numt" x="322" y="396.4" font-size="13" text-anchor="middle">3</text><g transform="translate(340 380.88) scale(0.917)"><path class="ex-ic" d="M4 12l5 5L20 6"/></g><text class="ex-t" x="372" y="386.7" font-size="14"><tspan x="372" dy="0">Verify the round trip byte</tspan><tspan x="372" dy="18.5">for byte.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="66" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">NULL</text><text class="ex-head" x="664" y="229.5" font-size="30"><tspan x="664" dy="0">1.532 bits</tspan><tspan x="664" dy="33.6">per weight</tspan></text><text class="ex-t" x="664" y="319.4" font-size="15"><tspan x="664" dy="0">The best of the lossless</tspan><tspan x="664" dy="20.4">coders tested (zstd -19)</tspan><tspan x="664" dy="20.4">reached 1.532 bits per weight</tspan><tspan x="664" dy="20.4">against 2.000 for the</tspan><tspan x="664" dy="20.4">engine&#x27;s current packing. The</tspan><tspan x="664" dy="20.4">round trip was byte-exact</tspan><tspan x="664" dy="20.4">with 0 mismatches. Against</tspan><tspan x="664" dy="20.4">ideal ternary packing (1.600)</tspan><tspan x="664" dy="20.4">the saving is about 4%.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">Pretrained ternary</tspan><tspan x="970" dy="22.1">weights are close to</tspan><tspan x="970" dy="22.1">uniform, so lossless</tspan><tspan x="970" dy="22.1">coding gains little;</tspan><tspan x="970" dy="22.1">real savings would</tspan><tspan x="970" dy="22.1">need changes to the</tspan><tspan x="970" dy="22.1">model. One model, one</tspan><tspan x="970" dy="22.1">machine; coding speed</tspan><tspan x="970" dy="22.1">not measured.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like zipping a file of coin flips: there is almost no pattern to squeeze out.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/es1-trit-census/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
