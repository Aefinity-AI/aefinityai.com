<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="E22: which spec rules does the test vector actually exercise?: the test explained in one picture"><title>E22: which spec rules does the test vector actually exercise?: the test explained in one picture</title><desc>Question: If we deliberately break one rule of our own spec, does the official test notice? How we tested: 1. Make 16 single-rule breaks (mutations) of the C verifier. 2. Build and run each against the pinned test vector on one machine. 3. Add unbroken builds at four optimisation levels as controls. 4. Count a rule as exercised if breaking it moves the digest. What we found (Mixed): 12 of 16 breaks caught. 12 of 16 mutations moved the digest, 3 did not and 1 was skipped. The tie-break rule is never reached by this vector. One &#x27;no effect&#x27; row (M16) was a vacuous edit that tested nothing; we corrected it in place. Unbroken builds matched at all four optimisation levels. What it means: A passing test does not prove every rule matters. A rule the vector cannot detect is untested, not unnecessary. One compiler, one machine, one 135M model, one short prompt.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-mixed);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L13<tspan class="ex-dot" dx="10">MIXED</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">E22: which spec rules does the test vector actually exercise?</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">If we</tspan><tspan x="38" dy="24.7">deliberately</tspan><tspan x="38" dy="24.7">break one rule of</tspan><tspan x="38" dy="24.7">our own spec,</tspan><tspan x="38" dy="24.7">does the official</tspan><tspan x="38" dy="24.7">test notice?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="339.4" y2="339.4"/><text class="ex-lab" x="38" y="357.4" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="377.4" font-size="14"><tspan x="38" dy="0">A passing test only means</tspan><tspan x="38" dy="18.9">something if breaking the</tspan><tspan x="38" dy="18.9">rules makes it fail. We</tspan><tspan x="38" dy="18.9">broke our own rules to see</tspan><tspan x="38" dy="18.9">how much the test notices.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="89.6" rx="9"/><circle class="ex-num" cx="322" cy="210.8" r="11"/><text class="ex-numt" x="322" y="215.3" font-size="13" text-anchor="middle">1</text><g transform="translate(340 199.785) scale(0.917)"><path class="ex-ic" d="M14.5 4a4.5 4.5 0 0 0-4 6.3L4 16.8 7.2 20l6.5-6.5A4.5 4.5 0 0 0 20 9.5l-3 3-3-1-1-3 3-3z"/></g><text class="ex-t" x="372" y="196.4" font-size="14"><tspan x="372" dy="0">Make 16 single-rule breaks</tspan><tspan x="372" dy="18.5">(mutations) of the C</tspan><tspan x="372" dy="18.5">verifier.</tspan></text><rect class="ex-sub" x="302" y="265.6" width="306" height="89.6" rx="9"/><circle class="ex-num" cx="322" cy="310.4" r="11"/><text class="ex-numt" x="322" y="314.9" font-size="13" text-anchor="middle">2</text><g transform="translate(340 299.355) scale(0.917)"><path class="ex-ic" d="M8 5l11 7-11 7z"/></g><text class="ex-t" x="372" y="295.9" font-size="14"><tspan x="372" dy="0">Build and run each against</tspan><tspan x="372" dy="18.5">the pinned test vector on one</tspan><tspan x="372" dy="18.5">machine.</tspan></text><rect class="ex-sub" x="302" y="365.1" width="306" height="89.6" rx="9"/><circle class="ex-num" cx="322" cy="409.9" r="11"/><text class="ex-numt" x="322" y="414.4" font-size="13" text-anchor="middle">3</text><g transform="translate(340 398.92499999999995) scale(0.917)"><path class="ex-ic" d="M4 12a8 8 0 0 1 14-5 M18 3v4h-4 M20 12a8 8 0 0 1-14 5 M6 21v-4h4"/></g><text class="ex-t" x="372" y="395.5" font-size="14"><tspan x="372" dy="0">Add unbroken builds at four</tspan><tspan x="372" dy="18.5">optimisation levels as</tspan><tspan x="372" dy="18.5">controls.</tspan></text><rect class="ex-sub" x="302" y="464.7" width="306" height="71.1" rx="9"/><circle class="ex-num" cx="322" cy="500.3" r="11"/><text class="ex-numt" x="322" y="504.8" font-size="13" text-anchor="middle">4</text><g transform="translate(340 489.255) scale(0.917)"><path class="ex-ic" d="M5 5v14 M10 5v14 M15 5v14 M3 17L21 7"/></g><text class="ex-t" x="372" y="495.1" font-size="14"><tspan x="372" dy="0">Count a rule as exercised if</tspan><tspan x="372" dy="18.5">breaking it moves the digest.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="74" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">MIXED</text><text class="ex-head" x="664" y="229.5" font-size="30"><tspan x="664" dy="0">12 of 16</tspan><tspan x="664" dy="33.6">breaks caught</tspan></text><text class="ex-t" x="664" y="319.4" font-size="15"><tspan x="664" dy="0">12 of 16 mutations moved the</tspan><tspan x="664" dy="20.4">digest, 3 did not and 1 was</tspan><tspan x="664" dy="20.4">skipped. The tie-break rule</tspan><tspan x="664" dy="20.4">is never reached by this</tspan><tspan x="664" dy="20.4">vector. One &#x27;no effect&#x27; row</tspan><tspan x="664" dy="20.4">(M16) was a vacuous edit that</tspan><tspan x="664" dy="20.4">tested nothing; we corrected</tspan><tspan x="664" dy="20.4">it in place. Unbroken builds</tspan><tspan x="664" dy="20.4">matched at all four</tspan><tspan x="664" dy="20.4">optimisation levels.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">A passing test does</tspan><tspan x="970" dy="22.1">not prove every rule</tspan><tspan x="970" dy="22.1">matters. A rule the</tspan><tspan x="970" dy="22.1">vector cannot detect</tspan><tspan x="970" dy="22.1">is untested, not</tspan><tspan x="970" dy="22.1">unnecessary. One</tspan><tspan x="970" dy="22.1">compiler, one</tspan><tspan x="970" dy="22.1">machine, one 135M</tspan><tspan x="970" dy="22.1">model, one short</tspan><tspan x="970" dy="22.1">prompt.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like testing a smoke alarm with 16 kinds of fire: it sounded for 12, stayed silent for 3, and 1 was not tried.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/e22-necessity-matrix/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
