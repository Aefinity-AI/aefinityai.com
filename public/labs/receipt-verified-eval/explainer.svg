.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L08<tspan class="ex-dot" dx="10">MIXED</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">Receipt-verified agent evaluation, and the hole we found in our own verifier</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">If every test</tspan><tspan x="38" dy="24.7">item needs a</tspan><tspan x="38" dy="24.7">verified receipt,</tspan><tspan x="38" dy="24.7">can someone pass</tspan><tspan x="38" dy="24.7">off a genuine</tspan><tspan x="38" dy="24.7">receipt under the</tspan><tspan x="38" dy="24.7">wrong item?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="364.1" y2="364.1"/><text class="ex-lab" x="38" y="382.1" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="402.1" font-size="14"><tspan x="38" dy="0">If a test score depends on</tspan><tspan x="38" dy="18.9">receipts, someone could</tspan><tspan x="38" dy="18.9">present a real receipt for</tspan><tspan x="38" dy="18.9">the wrong item. We tried</tspan><tspan x="38" dy="18.9">to do exactly that to our</tspan><tspan x="38" dy="18.9">own verifier.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="110.4" rx="9"/><circle class="ex-num" cx="322" cy="221.2" r="11"/><text class="ex-numt" x="322" y="225.7" font-size="13" text-anchor="middle">1</text><g transform="translate(340 210.22) scale(0.917)"><path class="ex-ic" d="M8 5l11 7-11 7z"/></g><text class="ex-t" x="372" y="197.6" font-size="14"><tspan x="372" dy="0">Run 60 single-tool-call</tspan><tspan x="372" dy="18.5">items; each emits a receipt</tspan><tspan x="372" dy="18.5">that is replayed before it is</tspan><tspan x="372" dy="18.5">scored.</tspan></text><rect class="ex-sub" x="302" y="286.4" width="306" height="128.9" rx="9"/><circle class="ex-num" cx="322" cy="350.9" r="11"/><text class="ex-numt" x="322" y="355.4" font-size="13" text-anchor="middle">2</text><g transform="translate(340 339.9) scale(0.917)"><path class="ex-ic" d="M14.5 4a4.5 4.5 0 0 0-4 6.3L4 16.8 7.2 20l6.5-6.5A4.5 4.5 0 0 0 20 9.5l-3 3-3-1-1-3 3-3z"/></g><text class="ex-t" x="372" y="318.0" font-size="14"><tspan x="372" dy="0">Apply four hand-made tampers:</tspan><tspan x="372" dy="18.5">flip an output token, change</tspan><tspan x="372" dy="18.5">an argument byte, cut the</tspan><tspan x="372" dy="18.5">chain, file a valid receipt</tspan><tspan x="372" dy="18.5">under another item.</tspan></text><rect class="ex-sub" x="302" y="425.4" width="306" height="110.4" rx="9"/><circle class="ex-num" cx="322" cy="480.6" r="11"/><text class="ex-numt" x="322" y="485.1" font-size="13" text-anchor="middle">3</text><g transform="translate(340 469.58) scale(0.917)"><path class="ex-ic" d="M4 8h13 M14 5l3 3-3 3 M20 16H7 M10 13l-3 3 3 3"/></g><text class="ex-t" x="372" y="456.9" font-size="14"><tspan x="372" dy="0">Test version 1 (no item</tspan><tspan x="372" dy="18.5">binding) and version 2 (item</tspan><tspan x="372" dy="18.5">id, prompt and a session</tspan><tspan x="372" dy="18.5">nonce bound in).</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="74" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">MIXED</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">v1 caught 3 of</tspan><tspan x="664" dy="31.4">4; v2 caught 4</tspan><tspan x="664" dy="31.4">of 4</tspan></text><text class="ex-t" x="664" y="344.6" font-size="15"><tspan x="664" dy="0">All 60 receipts verified and</tspan><tspan x="664" dy="20.4">45 of 60 items scored</tspan><tspan x="664" dy="20.4">correct. Version 1 caught 3</tspan><tspan x="664" dy="20.4">of the 4 tampers: a valid</tspan><tspan x="664" dy="20.4">receipt filed under another</tspan><tspan x="664" dy="20.4">item passed. After we bound</tspan><tspan x="664" dy="20.4">each receipt to its item,</tspan><tspan x="664" dy="20.4">version 2 caught all 4.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">A receipt can be</tspan><tspan x="970" dy="22.1">genuine and still sit</tspan><tspan x="970" dy="22.1">on the wrong item; we</tspan><tspan x="970" dy="22.1">found that by</tspan><tspan x="970" dy="22.1">attacking our own</tspan><tspan x="970" dy="22.1">verifier. The fix was</tspan><tspan x="970" dy="22.1">tested on the same</tspan><tspan x="970" dy="22.1">four cases, so 4 of 4</tspan><tspan x="970" dy="22.1">is not out-of-sample.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like a genuine ticket stub handed in for the wrong seat: the stub is real, so you must also check it is for this seat.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/receipt-verified-eval/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
