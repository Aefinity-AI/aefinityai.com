<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Receipt-verified agent evaluation, and the hole we found in our own verifier: the test explained in one picture"><title>Receipt-verified agent evaluation, and the hole we found in our own verifier: the test explained in one picture</title><desc>Question: If every test item needs a verified receipt, can someone pass off a genuine receipt under the wrong item? How we tested: 1. Run 60 single-tool-call items; each emits a receipt that is replayed before it is scored. 2. Apply four hand-made tampers: flip an output token, change an argument byte, cut the chain, file a valid receipt under another item. 3. Test version 1 (no item binding) and version 2 (item id, prompt and a session nonce bound in). What we found (Mixed): v1 caught 3 of 4; v2 caught 4 of 4. All 60 receipts verified and 45 of 60 items scored correct. Version 1 caught 3 of the 4 tampers: a valid receipt filed under another item passed. After we bound each receipt to its item, version 2 caught all 4. What it means: A receipt can be genuine and still sit on the wrong item; we found that by attacking our own verifier. The fix was tested on the same four cases, so 4 of 4 is not out-of-sample.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-mixed);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
