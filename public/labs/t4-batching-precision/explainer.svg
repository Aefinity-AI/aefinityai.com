<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Batching and precision on a Tesla T4: which shortcuts change the digest: the test explained in one picture"><title>Batching and precision on a Tesla T4: which shortcuts change the digest: the test explained in one picture</title><desc>Question: Do common GPU speed shortcuts, like batching requests or switching to int8, quietly change the answer? How we tested: 1. Take one matrix multiply from the model (layer 0, q_proj). 2. Compute it on a Tesla T4 and a CPU three ways: row-batched fp32, grouped fp32, int8; batch sizes 1, 4, 8. 3. Count how many of the 576 output values differ from the batch-1 CPU answer. 4. Compare CPU and GPU digests across all 10 configurations. What we found (Positive): Row-batched: 0 of 576 differ. Row-batched fp32 matched the reference exactly at every batch size, on CPU and GPU. Grouped fp32 and int8 changed the result at every batch size (455 and 576 of 576 differ), as predicted before the run. CPU and GPU digests agreed on all 10. What it means: The pinned order of operations decided the digest, which is what a digest should detect. One matrix multiply on one GPU type, so it shows the check works there, not everywhere.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-positive);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
