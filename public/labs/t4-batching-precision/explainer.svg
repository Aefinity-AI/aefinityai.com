.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L03<tspan class="ex-dot" dx="10">POSITIVE</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">Batching and precision on a Tesla T4: which shortcuts change the digest</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="476" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="476" rx="12"/><path class="ex-chev" d="M274.0 352.0l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="476" rx="12"/><path class="ex-chev" d="M630.0 352.0l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="476" rx="12"/><path class="ex-chev" d="M940.0 352.0l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Do common GPU</tspan><tspan x="38" dy="24.7">speed shortcuts,</tspan><tspan x="38" dy="24.7">like batching</tspan><tspan x="38" dy="24.7">requests or</tspan><tspan x="38" dy="24.7">switching to</tspan><tspan x="38" dy="24.7">int8, quietly</tspan><tspan x="38" dy="24.7">change the</tspan><tspan x="38" dy="24.7">answer?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="388.8" y2="388.8"/><text class="ex-lab" x="38" y="406.8" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="426.8" font-size="14"><tspan x="38" dy="0">Batching and lower</tspan><tspan x="38" dy="18.9">precision are the usual</tspan><tspan x="38" dy="18.9">ways to make serving</tspan><tspan x="38" dy="18.9">cheaper. If they silently</tspan><tspan x="38" dy="18.9">change answers, a receipt</tspan><tspan x="38" dy="18.9">has to be able to tell.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="203.5" r="11"/><text class="ex-numt" x="322" y="208.0" font-size="13" text-anchor="middle">1</text><g transform="translate(340 192.48000000000002) scale(0.917)"><path class="ex-ic" d="M7 7h10v10H7z M10 3v4 M14 3v4 M10 17v4 M14 17v4 M3 10h4 M3 14h4 M17 10h4 M17 14h4"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Take one matrix multiply from</tspan><tspan x="372" dy="18.5">the model (layer 0, q_proj).</tspan></text><rect class="ex-sub" x="302" y="251.0" width="306" height="111.9" rx="9"/><circle class="ex-num" cx="322" cy="306.9" r="11"/><text class="ex-numt" x="322" y="311.4" font-size="13" text-anchor="middle">2</text><g transform="translate(340 295.92) scale(0.917)"><path class="ex-ic" d="M8 5l11 7-11 7z"/></g><text class="ex-t" x="372" y="283.3" font-size="14"><tspan x="372" dy="0">Compute it on a Tesla T4 and</tspan><tspan x="372" dy="18.5">a CPU three ways: row-batched</tspan><tspan x="372" dy="18.5">fp32, grouped fp32, int8;</tspan><tspan x="372" dy="18.5">batch sizes 1, 4, 8.</tspan></text><rect class="ex-sub" x="302" y="372.9" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="419.6" r="11"/><text class="ex-numt" x="322" y="424.1" font-size="13" text-anchor="middle">3</text><g transform="translate(340 408.6) scale(0.917)"><path class="ex-ic" d="M5 5v14 M10 5v14 M15 5v14 M3 17L21 7"/></g><text class="ex-t" x="372" y="405.2" font-size="14"><tspan x="372" dy="0">Count how many of the 576</tspan><tspan x="372" dy="18.5">output values differ from the</tspan><tspan x="372" dy="18.5">batch-1 CPU answer.</tspan></text><rect class="ex-sub" x="302" y="476.3" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="513.8" r="11"/><text class="ex-numt" x="322" y="518.3" font-size="13" text-anchor="middle">4</text><g transform="translate(340 502.79999999999995) scale(0.917)"><path class="ex-ic" d="M4 8h13 M14 5l3 3-3 3 M20 16H7 M10 13l-3 3 3 3"/></g><text class="ex-t" x="372" y="508.6" font-size="14"><tspan x="372" dy="0">Compare CPU and GPU digests</tspan><tspan x="372" dy="18.5">across all 10 configurations.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="440" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="96" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">POSITIVE</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">Row-batched: 0</tspan><tspan x="664" dy="31.4">of 576 differ</tspan></text><text class="ex-t" x="664" y="313.3" font-size="15"><tspan x="664" dy="0">Row-batched fp32 matched the</tspan><tspan x="664" dy="20.4">reference exactly at every</tspan><tspan x="664" dy="20.4">batch size, on CPU and GPU.</tspan><tspan x="664" dy="20.4">Grouped fp32 and int8 changed</tspan><tspan x="664" dy="20.4">the result at every batch</tspan><tspan x="664" dy="20.4">size (455 and 576 of 576</tspan><tspan x="664" dy="20.4">differ), as predicted before</tspan><tspan x="664" dy="20.4">the run. CPU and GPU digests</tspan><tspan x="664" dy="20.4">agreed on all 10.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">The pinned order of</tspan><tspan x="970" dy="22.1">operations decided</tspan><tspan x="970" dy="22.1">the digest, which is</tspan><tspan x="970" dy="22.1">what a digest should</tspan><tspan x="970" dy="22.1">detect. One matrix</tspan><tspan x="970" dy="22.1">multiply on one GPU</tspan><tspan x="970" dy="22.1">type, so it shows the</tspan><tspan x="970" dy="22.1">check works there,</tspan><tspan x="970" dy="22.1">not everywhere.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/t4-batching-precision/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
