<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Clean-room reimplementations: one mismatch (from a memo), one match (from spec v0.1), one partial that exposed a spec error: the test explained in one picture"><title>Clean-room reimplementations: one mismatch (from a memo), one match (from spec v0.1), one partial that exposed a spec error: the test explained in one picture</title><desc>Question: Can someone who has never seen our code build the same bits from the written description alone? How we tested: 1. Give isolated AI coding agents the written material only, never our source code. 2. Three attempts: Rust from an internal memo, Rust from spec v0.1, C11 from spec v0.2. 3. Compare four digests and 16 token ids with the reference on x86_64 and aarch64. 4. When the C version missed one digest, hash every tensor and find where they first differ. What we found (Mixed): 1 miss, 1 match, 1 partial. The memo-based build did not match. The spec v0.1 build matched all four digests and 16 token ids on its first run. The C11 build matched 3 of 4; the miss traced to our own spec text listing the digest-chain items in the wrong order. After we fixed the spec, it matched 4 of 4. What it means: A written description can be enough, and a failed attempt exposed a real bug in our spec. But the builders were AI agents run by one operator inside our organisation, and the cited CI runs are private.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-mixed);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
