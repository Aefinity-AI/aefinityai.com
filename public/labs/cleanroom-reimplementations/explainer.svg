.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L04<tspan class="ex-dot" dx="10">MIXED</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">Clean-room reimplementations: one mismatch (from a memo), one match (from</tspan><tspan x="24" dy="30.0">spec v0.1), one partial that exposed a spec error</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="409.6" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="409.6" rx="12"/><path class="ex-chev" d="M274.0 318.8l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="409.6" rx="12"/><path class="ex-chev" d="M630.0 318.8l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="409.6" rx="12"/><path class="ex-chev" d="M940.0 318.8l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Can someone who</tspan><tspan x="38" dy="24.7">has never seen</tspan><tspan x="38" dy="24.7">our code build</tspan><tspan x="38" dy="24.7">the same bits</tspan><tspan x="38" dy="24.7">from the written</tspan><tspan x="38" dy="24.7">description</tspan><tspan x="38" dy="24.7">alone?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="364.1" y2="364.1"/><text class="ex-lab" x="38" y="382.1" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="402.1" font-size="14"><tspan x="38" dy="0">A specification is only</tspan><tspan x="38" dy="18.9">useful if someone who</tspan><tspan x="38" dy="18.9">never saw the original</tspan><tspan x="38" dy="18.9">code can build the same</tspan><tspan x="38" dy="18.9">thing from it.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="80.4" rx="9"/><circle class="ex-num" cx="322" cy="206.2" r="11"/><text class="ex-numt" x="322" y="210.7" font-size="13" text-anchor="middle">1</text><g transform="translate(340 195.2) scale(0.917)"><path class="ex-ic" d="M6 11h12v9H6z M8 11V8a4 4 0 0 1 8 0v3"/></g><text class="ex-t" x="372" y="191.8" font-size="14"><tspan x="372" dy="0">Give isolated AI coding</tspan><tspan x="372" dy="18.5">agents the written material</tspan><tspan x="372" dy="18.5">only, never our source code.</tspan></text><rect class="ex-sub" x="302" y="256.4" width="306" height="80.4" rx="9"/><circle class="ex-num" cx="322" cy="296.6" r="11"/><text class="ex-numt" x="322" y="301.1" font-size="13" text-anchor="middle">2</text><g transform="translate(340 285.59999999999997) scale(0.917)"><path class="ex-ic" d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/></g><text class="ex-t" x="372" y="282.2" font-size="14"><tspan x="372" dy="0">Three attempts: Rust from an</tspan><tspan x="372" dy="18.5">internal memo, Rust from spec</tspan><tspan x="372" dy="18.5">v0.1, C11 from spec v0.2.</tspan></text><rect class="ex-sub" x="302" y="346.8" width="306" height="80.4" rx="9"/><circle class="ex-num" cx="322" cy="387.0" r="11"/><text class="ex-numt" x="322" y="391.5" font-size="13" text-anchor="middle">3</text><g transform="translate(340 375.99999999999994) scale(0.917)"><path class="ex-ic" d="M4 8h13 M14 5l3 3-3 3 M20 16H7 M10 13l-3 3 3 3"/></g><text class="ex-t" x="372" y="372.6" font-size="14"><tspan x="372" dy="0">Compare four digests and 16</tspan><tspan x="372" dy="18.5">token ids with the reference</tspan><tspan x="372" dy="18.5">on x86_64 and aarch64.</tspan></text><rect class="ex-sub" x="302" y="437.2" width="306" height="80.4" rx="9"/><circle class="ex-num" cx="322" cy="477.4" r="11"/><text class="ex-numt" x="322" y="481.9" font-size="13" text-anchor="middle">4</text><g transform="translate(340 466.3999999999999) scale(0.917)"><path class="ex-ic" d="M10 4a6 6 0 1 0 0 12a6 6 0 0 0 0-12z M14.5 14.5L20 20"/></g><text class="ex-t" x="372" y="463.0" font-size="14"><tspan x="372" dy="0">When the C version missed one</tspan><tspan x="372" dy="18.5">digest, hash every tensor and</tspan><tspan x="372" dy="18.5">find where they first differ.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="373.6" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="74" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">MIXED</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">1 miss, 1</tspan><tspan x="664" dy="31.4">match, 1</tspan><tspan x="664" dy="31.4">partial</tspan></text><text class="ex-t" x="664" y="343.4" font-size="13.5"><tspan x="664" dy="0">The memo-based build did not</tspan><tspan x="664" dy="18.4">match. The spec v0.1 build</tspan><tspan x="664" dy="18.4">matched all four digests and 16</tspan><tspan x="664" dy="18.4">token ids on its first run. The</tspan><tspan x="664" dy="18.4">C11 build matched 3 of 4; the</tspan><tspan x="664" dy="18.4">miss traced to our own spec text</tspan><tspan x="664" dy="18.4">listing the digest-chain items</tspan><tspan x="664" dy="18.4">in the wrong order. After we</tspan><tspan x="664" dy="18.4">fixed the spec, it matched 4 of</tspan><tspan x="664" dy="18.4">4.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">A written description</tspan><tspan x="970" dy="22.1">can be enough, and a</tspan><tspan x="970" dy="22.1">failed attempt</tspan><tspan x="970" dy="22.1">exposed a real bug in</tspan><tspan x="970" dy="22.1">our spec. But the</tspan><tspan x="970" dy="22.1">builders were AI</tspan><tspan x="970" dy="22.1">agents run by one</tspan><tspan x="970" dy="22.1">operator inside our</tspan><tspan x="970" dy="22.1">organisation, and the</tspan><tspan x="970" dy="22.1">cited CI runs are</tspan><tspan x="970" dy="22.1">private.</tspan></text><rect class="ex-strip" x="24" y="541.6" width="1152" height="54.4" rx="9"/><text class="ex-t ex-em" x="42" y="563.5" font-size="14"><tspan x="42" dy="0">Like handing a recipe to a cook who has never seen your kitchen: when the dish comes out slightly off, the typo turns out to be in the</tspan><tspan x="42" dy="18.2">recipe.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/cleanroom-reimplementations/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
