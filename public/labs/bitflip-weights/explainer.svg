<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="One flipped bit in the weights: which checks notice?: the test explained in one picture"><title>One flipped bit in the weights: which checks notice?: the test explained in one picture</title><desc>Question: If one bit of an AI model&#x27;s weights is silently corrupted, can you tell by re-reading its output, or must you check the computation itself? How we tested: 1. Take one pruned BitNet-2B model and one prompt, 64 tokens. 2. Flip single bits in the weights: 50 trials, then 295 trials across tensor classes. 3. Run three checks on each corrupted run: same text, same top-5 candidates, same computation digest. 4. Count misses with 95% intervals; recount from raw logs on a second host. What we found (Positive): 182 of 247 missed by text. In the 295-trial run, 247 flips changed the model&#x27;s output scores. Text replay missed 182 of them and the top-5 check missed 82. The computation digest missed 0, which is true by construction. 43 flips changed nothing in the computation. What it means: Comparing output text missed most of the real changes in this test. One model, one prompt, flips chosen by our harness, no adversary. The informative numbers are the two weaker checks&#x27; misses, not the digest&#x27;s built-in 0.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-positive);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L06<tspan class="ex-dot" dx="10">POSITIVE</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">One flipped bit in the weights: which checks notice?</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="185.6" font-size="17"><tspan x="38" dy="0">If one bit of an AI</tspan><tspan x="38" dy="22.1">model&#x27;s weights is</tspan><tspan x="38" dy="22.1">silently corrupted,</tspan><tspan x="38" dy="22.1">can you tell by</tspan><tspan x="38" dy="22.1">re-reading its</tspan><tspan x="38" dy="22.1">output, or must you</tspan><tspan x="38" dy="22.1">check the</tspan><tspan x="38" dy="22.1">computation itself?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="366.4" y2="366.4"/><text class="ex-lab" x="38" y="384.4" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="404.4" font-size="12.5"><tspan x="38" dy="0">Weights are files that can be</tspan><tspan x="38" dy="16.9">corrupted or tampered with.</tspan><tspan x="38" dy="16.9">Re-reading the answer is the</tspan><tspan x="38" dy="16.9">cheap check; checking the</tspan><tspan x="38" dy="16.9">computation is the expensive</tspan><tspan x="38" dy="16.9">one. We wanted to know how</tspan><tspan x="38" dy="16.9">much the cheap one misses.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="80.3" rx="9"/><circle class="ex-num" cx="322" cy="206.2" r="11"/><text class="ex-numt" x="322" y="210.7" font-size="13" text-anchor="middle">1</text><g transform="translate(340 195.165) scale(0.917)"><path class="ex-ic" d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/></g><text class="ex-t" x="372" y="191.7" font-size="14"><tspan x="372" dy="0">Take one pruned BitNet-2B</tspan><tspan x="372" dy="18.5">model and one prompt, 64</tspan><tspan x="372" dy="18.5">tokens.</tspan></text><rect class="ex-sub" x="302" y="256.3" width="306" height="80.3" rx="9"/><circle class="ex-num" cx="322" cy="296.5" r="11"/><text class="ex-numt" x="322" y="301.0" font-size="13" text-anchor="middle">2</text><g transform="translate(340 285.495) scale(0.917)"><path class="ex-ic" d="M8 20V5 M4 9l4-4 4 4 M16 4v15 M12 15l4 4 4-4"/></g><text class="ex-t" x="372" y="282.1" font-size="14"><tspan x="372" dy="0">Flip single bits in the</tspan><tspan x="372" dy="18.5">weights: 50 trials, then 295</tspan><tspan x="372" dy="18.5">trials across tensor classes.</tspan></text><rect class="ex-sub" x="302" y="346.7" width="306" height="98.8" rx="9"/><circle class="ex-num" cx="322" cy="396.1" r="11"/><text class="ex-numt" x="322" y="400.6" font-size="13" text-anchor="middle">3</text><g transform="translate(340 385.06499999999994) scale(0.917)"><path class="ex-ic" d="M4 12l5 5L20 6"/></g><text class="ex-t" x="372" y="372.4" font-size="14"><tspan x="372" dy="0">Run three checks on each</tspan><tspan x="372" dy="18.5">corrupted run: same text,</tspan><tspan x="372" dy="18.5">same top-5 candidates, same</tspan><tspan x="372" dy="18.5">computation digest.</tspan></text><rect class="ex-sub" x="302" y="455.5" width="306" height="80.3" rx="9"/><circle class="ex-num" cx="322" cy="495.6" r="11"/><text class="ex-numt" x="322" y="500.1" font-size="13" text-anchor="middle">4</text><g transform="translate(340 484.635) scale(0.917)"><path class="ex-ic" d="M5 5v14 M10 5v14 M15 5v14 M3 17L21 7"/></g><text class="ex-t" x="372" y="481.2" font-size="14"><tspan x="372" dy="0">Count misses with 95%</tspan><tspan x="372" dy="18.5">intervals; recount from raw</tspan><tspan x="372" dy="18.5">logs on a second host.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="96" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">POSITIVE</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">182 of 247</tspan><tspan x="664" dy="31.4">missed by text</tspan></text><text class="ex-t" x="664" y="313.3" font-size="15"><tspan x="664" dy="0">In the 295-trial run, 247</tspan><tspan x="664" dy="20.4">flips changed the model&#x27;s</tspan><tspan x="664" dy="20.4">output scores. Text replay</tspan><tspan x="664" dy="20.4">missed 182 of them and the</tspan><tspan x="664" dy="20.4">top-5 check missed 82. The</tspan><tspan x="664" dy="20.4">computation digest missed 0,</tspan><tspan x="664" dy="20.4">which is true by</tspan><tspan x="664" dy="20.4">construction. 43 flips</tspan><tspan x="664" dy="20.4">changed nothing in the</tspan><tspan x="664" dy="20.4">computation.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">Comparing output text</tspan><tspan x="970" dy="22.1">missed most of the</tspan><tspan x="970" dy="22.1">real changes in this</tspan><tspan x="970" dy="22.1">test. One model, one</tspan><tspan x="970" dy="22.1">prompt, flips chosen</tspan><tspan x="970" dy="22.1">by our harness, no</tspan><tspan x="970" dy="22.1">adversary. The</tspan><tspan x="970" dy="22.1">informative numbers</tspan><tspan x="970" dy="22.1">are the two weaker</tspan><tspan x="970" dy="22.1">checks&#x27; misses, not</tspan><tspan x="970" dy="22.1">the digest&#x27;s built-in</tspan><tspan x="970" dy="22.1">0.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like judging a cake by its look: a swapped ingredient can slip past, but re-baking it step by step shows the difference.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/bitflip-weights/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
