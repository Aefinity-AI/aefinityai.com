<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="RANGER Phase 1: the quantization ideas on real models (SmolLM2-135M, Qwen3-0.6B): the test explained in one picture"><title>RANGER Phase 1: the quantization ideas on real models (SmolLM2-135M, Qwen3-0.6B): the test explained in one picture</title><desc>Question: Do those shrinking tricks survive on real pretrained models, and was our earlier null result even valid? How we tested: 1. Measure perplexity on a WikiText-2 slice for SmolLM2-135M; replicate on Qwen3-0.6B. 2. Fix predictions and kill gates before each run; claim effects only above 3x run noise. 3. Re-test small effects on disjoint slices. What we found (Mixed): Rotation recovers 92.3%. Our earlier E7 null result was retracted as an artifact of how it was built. 4-bit activations collapsed perplexity from 16.14 to 13,773; a rotation recovered 92.3% of the collapse on SmolLM2-135M and 92.5% on Qwen3-0.6B. &#x27;Skip the rotation&#x27; was refuted. What it means: Recovery is of the collapse, not full parity (27.11 against 16.14). Two small models, CPU only, simulated quantization as an upper bound, one text slice plus one confirmation slice.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-mixed);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L26<tspan class="ex-dot" dx="10">MIXED</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">RANGER Phase 1: the quantization ideas on real models (SmolLM2-135M,</tspan><tspan x="24" dy="30.0">Qwen3-0.6B)</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="476" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="476" rx="12"/><path class="ex-chev" d="M274.0 352.0l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="476" rx="12"/><path class="ex-chev" d="M630.0 352.0l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="476" rx="12"/><path class="ex-chev" d="M940.0 352.0l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Do those</tspan><tspan x="38" dy="24.7">shrinking tricks</tspan><tspan x="38" dy="24.7">survive on real</tspan><tspan x="38" dy="24.7">pretrained</tspan><tspan x="38" dy="24.7">models, and was</tspan><tspan x="38" dy="24.7">our earlier null</tspan><tspan x="38" dy="24.7">result even</tspan><tspan x="38" dy="24.7">valid?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="388.8" y2="388.8"/><text class="ex-lab" x="38" y="406.8" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="426.8" font-size="14"><tspan x="38" dy="0">Synthetic results do not</tspan><tspan x="38" dy="18.9">count until they survive</tspan><tspan x="38" dy="18.9">on real models.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="111.9" rx="9"/><circle class="ex-num" cx="322" cy="222.0" r="11"/><text class="ex-numt" x="322" y="226.5" font-size="13" text-anchor="middle">1</text><g transform="translate(340 210.96) scale(0.917)"><path class="ex-ic" d="M5 20V10 M12 20V4 M19 20v-7 M3 20h18"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Measure perplexity on a</tspan><tspan x="372" dy="18.5">WikiText-2 slice for</tspan><tspan x="372" dy="18.5">SmolLM2-135M; replicate on</tspan><tspan x="372" dy="18.5">Qwen3-0.6B.</tspan></text><rect class="ex-sub" x="302" y="287.9" width="306" height="111.9" rx="9"/><circle class="ex-num" cx="322" cy="343.9" r="11"/><text class="ex-numt" x="322" y="348.4" font-size="13" text-anchor="middle">2</text><g transform="translate(340 332.88) scale(0.917)"><path class="ex-ic" d="M6 21V4 M6 4h12l-3 4 3 4H6"/></g><text class="ex-t" x="372" y="320.2" font-size="14"><tspan x="372" dy="0">Fix predictions and kill</tspan><tspan x="372" dy="18.5">gates before each run; claim</tspan><tspan x="372" dy="18.5">effects only above 3x run</tspan><tspan x="372" dy="18.5">noise.</tspan></text><rect class="ex-sub" x="302" y="409.8" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="447.3" r="11"/><text class="ex-numt" x="322" y="451.8" font-size="13" text-anchor="middle">3</text><g transform="translate(340 436.32000000000005) scale(0.917)"><path class="ex-ic" d="M4 12a8 8 0 0 1 14-5 M18 3v4h-4 M20 12a8 8 0 0 1-14 5 M6 21v-4h4"/></g><text class="ex-t" x="372" y="442.1" font-size="14"><tspan x="372" dy="0">Re-test small effects on</tspan><tspan x="372" dy="18.5">disjoint slices.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="440" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="74" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">MIXED</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">Rotation</tspan><tspan x="664" dy="31.4">recovers 92.3%</tspan></text><text class="ex-t" x="664" y="313.3" font-size="15"><tspan x="664" dy="0">Our earlier E7 null result</tspan><tspan x="664" dy="20.4">was retracted as an artifact</tspan><tspan x="664" dy="20.4">of how it was built. 4-bit</tspan><tspan x="664" dy="20.4">activations collapsed</tspan><tspan x="664" dy="20.4">perplexity from 16.14 to</tspan><tspan x="664" dy="20.4">13,773; a rotation recovered</tspan><tspan x="664" dy="20.4">92.3% of the collapse on</tspan><tspan x="664" dy="20.4">SmolLM2-135M and 92.5% on</tspan><tspan x="664" dy="20.4">Qwen3-0.6B. &#x27;Skip the</tspan><tspan x="664" dy="20.4">rotation&#x27; was refuted.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">Recovery is of the</tspan><tspan x="970" dy="22.1">collapse, not full</tspan><tspan x="970" dy="22.1">parity (27.11 against</tspan><tspan x="970" dy="22.1">16.14). Two small</tspan><tspan x="970" dy="22.1">models, CPU only,</tspan><tspan x="970" dy="22.1">simulated</tspan><tspan x="970" dy="22.1">quantization as an</tspan><tspan x="970" dy="22.1">upper bound, one text</tspan><tspan x="970" dy="22.1">slice plus one</tspan><tspan x="970" dy="22.1">confirmation slice.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/ranger-phase1/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
