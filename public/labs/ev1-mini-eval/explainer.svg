<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ev-1: a 160-item mini evaluation on the pinned 135M model: the test explained in one picture"><title>ev-1: a 160-item mini evaluation on the pinned 135M model: the test explained in one picture</title><desc>Question: Can a tiny model be evaluated in a way anyone can repeat exactly, and what does it actually score? How we tested: 1. Assemble 160 items in four categories. 2. Run them through the repository&#x27;s reference program on SmolLM2-135M, fp32, greedy. 3. Score with simple substring and refusal-marker rules. 4. Run twice and compare digests. What we found (Mixed): Low scores, 20 of 20 repeat. Truthfulness 3 of 60, refusal probes 10 of 20 (chance level), tool-use proxy 5 of 60. Self-consistency: 20 of 20 items gave identical digests across two runs on one host. What it means: The model scores poorly but repeats exactly on one machine; the point is repeatability, not accuracy. A 135M base model, weak scoring rules, no second-host check, and the refusal items are not a safety measurement.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-mixed);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L22<tspan class="ex-dot" dx="10">MIXED</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">ev-1: a 160-item mini evaluation on the pinned 135M model</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="476" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="476" rx="12"/><path class="ex-chev" d="M274.0 352.0l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="476" rx="12"/><path class="ex-chev" d="M630.0 352.0l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="476" rx="12"/><path class="ex-chev" d="M940.0 352.0l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Can a tiny model</tspan><tspan x="38" dy="24.7">be evaluated in a</tspan><tspan x="38" dy="24.7">way anyone can</tspan><tspan x="38" dy="24.7">repeat exactly,</tspan><tspan x="38" dy="24.7">and what does it</tspan><tspan x="38" dy="24.7">actually score?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="339.4" y2="339.4"/><text class="ex-lab" x="38" y="357.4" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="377.4" font-size="14"><tspan x="38" dy="0">Before measuring big</tspan><tspan x="38" dy="18.9">claims we wanted a small</tspan><tspan x="38" dy="18.9">evaluation anyone can</tspan><tspan x="38" dy="18.9">repeat bit for bit.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="203.5" r="11"/><text class="ex-numt" x="322" y="208.0" font-size="13" text-anchor="middle">1</text><g transform="translate(340 192.48000000000002) scale(0.917)"><path class="ex-ic" d="M9 6h11 M9 12h11 M9 18h11 M4 6h.5 M4 12h.5 M4 18h.5"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Assemble 160 items in four</tspan><tspan x="372" dy="18.5">categories.</tspan></text><rect class="ex-sub" x="302" y="251.0" width="306" height="111.9" rx="9"/><circle class="ex-num" cx="322" cy="306.9" r="11"/><text class="ex-numt" x="322" y="311.4" font-size="13" text-anchor="middle">2</text><g transform="translate(340 295.92) scale(0.917)"><path class="ex-ic" d="M8 5l11 7-11 7z"/></g><text class="ex-t" x="372" y="283.3" font-size="14"><tspan x="372" dy="0">Run them through the</tspan><tspan x="372" dy="18.5">repository&#x27;s reference</tspan><tspan x="372" dy="18.5">program on SmolLM2-135M,</tspan><tspan x="372" dy="18.5">fp32, greedy.</tspan></text><rect class="ex-sub" x="302" y="372.9" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="410.4" r="11"/><text class="ex-numt" x="322" y="414.9" font-size="13" text-anchor="middle">3</text><g transform="translate(340 399.36) scale(0.917)"><path class="ex-ic" d="M5 5v14 M10 5v14 M15 5v14 M3 17L21 7"/></g><text class="ex-t" x="372" y="405.2" font-size="14"><tspan x="372" dy="0">Score with simple substring</tspan><tspan x="372" dy="18.5">and refusal-marker rules.</tspan></text><rect class="ex-sub" x="302" y="457.8" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="495.3" r="11"/><text class="ex-numt" x="322" y="499.8" font-size="13" text-anchor="middle">4</text><g transform="translate(340 484.32000000000005) scale(0.917)"><path class="ex-ic" d="M4 12a8 8 0 0 1 14-5 M18 3v4h-4 M20 12a8 8 0 0 1-14 5 M6 21v-4h4"/></g><text class="ex-t" x="372" y="490.1" font-size="14"><tspan x="372" dy="0">Run twice and compare</tspan><tspan x="372" dy="18.5">digests.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="440" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="74" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">MIXED</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">Low scores, 20</tspan><tspan x="664" dy="31.4">of 20 repeat</tspan></text><text class="ex-t" x="664" y="313.3" font-size="15"><tspan x="664" dy="0">Truthfulness 3 of 60, refusal</tspan><tspan x="664" dy="20.4">probes 10 of 20 (chance</tspan><tspan x="664" dy="20.4">level), tool-use proxy 5 of</tspan><tspan x="664" dy="20.4">60. Self-consistency: 20 of</tspan><tspan x="664" dy="20.4">20 items gave identical</tspan><tspan x="664" dy="20.4">digests across two runs on</tspan><tspan x="664" dy="20.4">one host.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">The model scores</tspan><tspan x="970" dy="22.1">poorly but repeats</tspan><tspan x="970" dy="22.1">exactly on one</tspan><tspan x="970" dy="22.1">machine; the point is</tspan><tspan x="970" dy="22.1">repeatability, not</tspan><tspan x="970" dy="22.1">accuracy. A 135M base</tspan><tspan x="970" dy="22.1">model, weak scoring</tspan><tspan x="970" dy="22.1">rules, no second-host</tspan><tspan x="970" dy="22.1">check, and the</tspan><tspan x="970" dy="22.1">refusal items are not</tspan><tspan x="970" dy="22.1">a safety measurement.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/ev1-mini-eval/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
