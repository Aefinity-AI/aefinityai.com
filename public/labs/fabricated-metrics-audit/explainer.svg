<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Audit of our own removed code: benchmark lines that measured nothing: the test explained in one picture"><title>Audit of our own removed code: benchmark lines that measured nothing: the test explained in one picture</title><desc>Question: Did an earlier version of our software print performance numbers it never measured? How we tested: 1. Review the print statements of a deleted crate preserved in git history. 2. Check whether they take any values to print at all (format arguments). What we found (Negative): Printed &#x27;results&#x27; were fixed text. The benchmark lines in the removed crate were fixed string literals with no format arguments: text asserting measurements that were never taken. The crate also did not compile (9 errors), so the numbers could not have come from a run. What it means: This audit is where our rule &#x27;every number needs a machine, a log and a source&#x27; came from. It covers our old code only; no experiment was run and it is a self-review.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-negative);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L31<tspan class="ex-dot" dx="10">NEGATIVE</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">Audit of our own removed code: benchmark lines that measured nothing</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Did an earlier</tspan><tspan x="38" dy="24.7">version of our</tspan><tspan x="38" dy="24.7">software print</tspan><tspan x="38" dy="24.7">performance</tspan><tspan x="38" dy="24.7">numbers it never</tspan><tspan x="38" dy="24.7">measured?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="339.4" y2="339.4"/><text class="ex-lab" x="38" y="357.4" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="377.4" font-size="14"><tspan x="38" dy="0">This is where our</tspan><tspan x="38" dy="18.9">provenance rule came from.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="212.7" r="11"/><text class="ex-numt" x="322" y="217.2" font-size="13" text-anchor="middle">1</text><g transform="translate(340 201.72) scale(0.917)"><path class="ex-ic" d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Review the print statements</tspan><tspan x="372" dy="18.5">of a deleted crate preserved</tspan><tspan x="372" dy="18.5">in git history.</tspan></text><rect class="ex-sub" x="302" y="269.4" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="316.2" r="11"/><text class="ex-numt" x="322" y="320.7" font-size="13" text-anchor="middle">2</text><g transform="translate(340 305.15999999999997) scale(0.917)"><path class="ex-ic" d="M10 4a6 6 0 1 0 0 12a6 6 0 0 0 0-12z M14.5 14.5L20 20"/></g><text class="ex-t" x="372" y="301.7" font-size="14"><tspan x="372" dy="0">Check whether they take any</tspan><tspan x="372" dy="18.5">values to print at all</tspan><tspan x="372" dy="18.5">(format arguments).</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="96" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">NEGATIVE</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">Printed</tspan><tspan x="664" dy="31.4">&#x27;results&#x27; were</tspan><tspan x="664" dy="31.4">fixed text</tspan></text><text class="ex-t" x="664" y="344.6" font-size="15"><tspan x="664" dy="0">The benchmark lines in the</tspan><tspan x="664" dy="20.4">removed crate were fixed</tspan><tspan x="664" dy="20.4">string literals with no</tspan><tspan x="664" dy="20.4">format arguments: text</tspan><tspan x="664" dy="20.4">asserting measurements that</tspan><tspan x="664" dy="20.4">were never taken. The crate</tspan><tspan x="664" dy="20.4">also did not compile (9</tspan><tspan x="664" dy="20.4">errors), so the numbers could</tspan><tspan x="664" dy="20.4">not have come from a run.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">This audit is where</tspan><tspan x="970" dy="22.1">our rule &#x27;every</tspan><tspan x="970" dy="22.1">number needs a</tspan><tspan x="970" dy="22.1">machine, a log and a</tspan><tspan x="970" dy="22.1">source&#x27; came from. It</tspan><tspan x="970" dy="22.1">covers our old code</tspan><tspan x="970" dy="22.1">only; no experiment</tspan><tspan x="970" dy="22.1">was run and it is a</tspan><tspan x="970" dy="22.1">self-review.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like a speedometer painted on the dashboard: it shows a number, but nothing is connected to it.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/fabricated-metrics-audit/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
