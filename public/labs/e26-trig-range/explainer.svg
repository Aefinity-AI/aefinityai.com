.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L16<tspan class="ex-dot" dx="10">MIXED</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">E26: sin/cos at very long contexts — the sampled answer was wrong</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="184.8" font-size="16"><tspan x="38" dy="0">Does the pinned</tspan><tspan x="38" dy="20.8">sin/cos stay accurate</tspan><tspan x="38" dy="20.8">at the huge angles a</tspan><tspan x="38" dy="20.8">million-token context</tspan><tspan x="38" dy="20.8">produces, and can</tspan><tspan x="38" dy="20.8">spot-checking tell</tspan><tspan x="38" dy="20.8">you?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="334.4" y2="334.4"/><text class="ex-lab" x="38" y="352.4" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="372.4" font-size="14"><tspan x="38" dy="0">Spot-checking a function</tspan><tspan x="38" dy="18.9">is cheap and can be</tspan><tspan x="38" dy="18.9">reassuring and wrong.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="203.5" r="11"/><text class="ex-numt" x="322" y="208.0" font-size="13" text-anchor="middle">1</text><g transform="translate(340 192.48000000000002) scale(0.917)"><path class="ex-ic" d="M9 6h11 M9 12h11 M9 18h11 M4 6h.5 M4 12h.5 M4 18h.5"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Run a sampled sweep: 4,096</tspan><tspan x="372" dy="18.5">inputs per range.</tspan></text><rect class="ex-sub" x="302" y="251.0" width="306" height="111.9" rx="9"/><circle class="ex-num" cx="322" cy="306.9" r="11"/><text class="ex-numt" x="322" y="311.4" font-size="13" text-anchor="middle">2</text><g transform="translate(340 295.92) scale(0.917)"><path class="ex-ic" d="M5 5v14 M10 5v14 M15 5v14 M3 17L21 7"/></g><text class="ex-t" x="372" y="283.3" font-size="14"><tspan x="372" dy="0">Replace it with an exhaustive</tspan><tspan x="372" dy="18.5">sweep of every float32 in [0,</tspan><tspan x="372" dy="18.5">2^20) against a float64</tspan><tspan x="372" dy="18.5">reference.</tspan></text><rect class="ex-sub" x="302" y="372.9" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="419.6" r="11"/><text class="ex-numt" x="322" y="424.1" font-size="13" text-anchor="middle">3</text><g transform="translate(340 408.6) scale(0.917)"><path class="ex-ic" d="M4 12l5 5L20 6"/></g><text class="ex-t" x="372" y="405.2" font-size="14"><tspan x="372" dy="0">Check symmetry and the rotary</tspan><tspan x="372" dy="18.5">angle sets for 131,072</tspan><tspan x="372" dy="18.5">positions on both models.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="74" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">MIXED</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">Sampling was</tspan><tspan x="664" dy="31.4">wrong; the</tspan><tspan x="664" dy="31.4">math held</tspan></text><text class="ex-t" x="664" y="342.9" font-size="13"><tspan x="664" dy="0">The sampled sweep reported at most</tspan><tspan x="664" dy="17.7">1 ULP below 2^16. Checking all</tspan><tspan x="664" dy="17.7">1,233,125,376 inputs below 2^20</tspan><tspan x="664" dy="17.7">found up to 66 ULP (sin) and 2283</tspan><tspan x="664" dy="17.7">(cos) below 2^16, but only near</tspan><tspan x="664" dy="17.7">zeros, where values are tiny.</tspan><tspan x="664" dy="17.7">Absolute error stayed flat at</tspan><tspan x="664" dy="17.7">9.4218e-8 or less, under one</tspan><tspan x="664" dy="17.7">float32 step at 1.0, for every</tspan><tspan x="664" dy="17.7">angle up to a 1,048,576-token</tspan><tspan x="664" dy="17.7">context.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">The pinned sin/cos</tspan><tspan x="970" dy="22.1">holds up at long</tspan><tspan x="970" dy="22.1">context, but the</tspan><tspan x="970" dy="22.1">sampled check could</tspan><tspan x="970" dy="22.1">not show it: 4,096</tspan><tspan x="970" dy="22.1">samples out of</tspan><tspan x="970" dy="22.1">8,388,608 per range</tspan><tspan x="970" dy="22.1">missed the hard</tspan><tspan x="970" dy="22.1">spots. ULP alone is</tspan><tspan x="970" dy="22.1">the wrong yardstick</tspan><tspan x="970" dy="22.1">near zeros. One host,</tspan><tspan x="970" dy="22.1">not a proof; nothing</tspan><tspan x="970" dy="22.1">is claimed at or</tspan><tspan x="970" dy="22.1">above 2^31.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like testing a few bolts on a bridge instead of every one.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/e26-trig-range/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
