<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="E26: sin/cos at very long contexts — the sampled answer was wrong: the test explained in one picture"><title>E26: sin/cos at very long contexts — the sampled answer was wrong: the test explained in one picture</title><desc>Question: Does the pinned sin/cos stay accurate at the huge angles a million-token context produces, and can spot-checking tell you? How we tested: 1. Run a sampled sweep: 4,096 inputs per range. 2. Replace it with an exhaustive sweep of every float32 in [0, 2^20) against a float64 reference. 3. Check symmetry and the rotary angle sets for 131,072 positions on both models. What we found (Mixed): Sampling was wrong; the math held. The sampled sweep reported at most 1 ULP below 2^16. Checking all 1,233,125,376 inputs below 2^20 found up to 66 ULP (sin) and 2283 (cos) below 2^16, but only near zeros, where values are tiny. Absolute error stayed flat at 9.4218e-8 or less, under one float32 step at 1.0, for every angle up to a 1,048,576-token context. What it means: The pinned sin/cos holds up at long context, but the sampled check could not show it: 4,096 samples out of 8,388,608 per range missed the hard spots. ULP alone is the wrong yardstick near zeros. One host, not a proof; nothing is claimed at or above 2^31.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-mixed);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
