<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="E29: does the compiler&#x27;s optimiser change the bits?: the test explained in one picture"><title>E29: does the compiler&#x27;s optimiser change the bits?: the test explained in one picture</title><desc>Question: Does getting identical results mean giving up on fast, optimised code? How we tested: 1. Dump every intermediate value of the decode from differently compiled builds. 2. Compare them exactly with sha256 and a structural diff; inspect the disassembly. 3. Cover three binaries on two models, then ten optimisation and target-CPU settings. What we found (Positive): 10 builds, 1 identical dump. The optimiser did vectorise the code (hundreds of AVX2 instructions) and the dumped values did not change. Ten distinct x86_64 binaries on SmolLM2-135M produced one identical 51,750,154-byte dump, with zero FMA instructions. What it means: For this decode, optimisation did not break identical results. One compiler version, six prompts, up to 64 generated tokens, ASCII only. The mechanism we first gave was later corrected.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-positive);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
