.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L19<tspan class="ex-dot" dx="10">POSITIVE</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">E29: does the compiler&#x27;s optimiser change the bits?</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="476" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="476" rx="12"/><path class="ex-chev" d="M274.0 352.0l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="476" rx="12"/><path class="ex-chev" d="M630.0 352.0l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="476" rx="12"/><path class="ex-chev" d="M940.0 352.0l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Does getting</tspan><tspan x="38" dy="24.7">identical results</tspan><tspan x="38" dy="24.7">mean giving up on</tspan><tspan x="38" dy="24.7">fast, optimised</tspan><tspan x="38" dy="24.7">code?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="314.7" y2="314.7"/><text class="ex-lab" x="38" y="332.7" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="352.7" font-size="14"><tspan x="38" dy="0">If identical results meant</tspan><tspan x="38" dy="18.9">giving up optimised code,</tspan><tspan x="38" dy="18.9">the approach would be too</tspan><tspan x="38" dy="18.9">slow to use.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="212.7" r="11"/><text class="ex-numt" x="322" y="217.2" font-size="13" text-anchor="middle">1</text><g transform="translate(340 201.72) scale(0.917)"><path class="ex-ic" d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Dump every intermediate value</tspan><tspan x="372" dy="18.5">of the decode from</tspan><tspan x="372" dy="18.5">differently compiled builds.</tspan></text><rect class="ex-sub" x="302" y="269.4" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="316.2" r="11"/><text class="ex-numt" x="322" y="320.7" font-size="13" text-anchor="middle">2</text><g transform="translate(340 305.15999999999997) scale(0.917)"><path class="ex-ic" d="M4 8h13 M14 5l3 3-3 3 M20 16H7 M10 13l-3 3 3 3"/></g><text class="ex-t" x="372" y="301.7" font-size="14"><tspan x="372" dy="0">Compare them exactly with</tspan><tspan x="372" dy="18.5">sha256 and a structural diff;</tspan><tspan x="372" dy="18.5">inspect the disassembly.</tspan></text><rect class="ex-sub" x="302" y="372.9" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="419.6" r="11"/><text class="ex-numt" x="322" y="424.1" font-size="13" text-anchor="middle">3</text><g transform="translate(340 408.6) scale(0.917)"><path class="ex-ic" d="M4 12a8 8 0 0 1 14-5 M18 3v4h-4 M20 12a8 8 0 0 1-14 5 M6 21v-4h4"/></g><text class="ex-t" x="372" y="405.2" font-size="14"><tspan x="372" dy="0">Cover three binaries on two</tspan><tspan x="372" dy="18.5">models, then ten optimisation</tspan><tspan x="372" dy="18.5">and target-CPU settings.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="440" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="96" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">POSITIVE</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">10 builds, 1</tspan><tspan x="664" dy="31.4">identical dump</tspan></text><text class="ex-t" x="664" y="313.3" font-size="15"><tspan x="664" dy="0">The optimiser did vectorise</tspan><tspan x="664" dy="20.4">the code (hundreds of AVX2</tspan><tspan x="664" dy="20.4">instructions) and the dumped</tspan><tspan x="664" dy="20.4">values did not change. Ten</tspan><tspan x="664" dy="20.4">distinct x86_64 binaries on</tspan><tspan x="664" dy="20.4">SmolLM2-135M produced one</tspan><tspan x="664" dy="20.4">identical 51,750,154-byte</tspan><tspan x="664" dy="20.4">dump, with zero FMA</tspan><tspan x="664" dy="20.4">instructions.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">For this decode,</tspan><tspan x="970" dy="22.1">optimisation did not</tspan><tspan x="970" dy="22.1">break identical</tspan><tspan x="970" dy="22.1">results. One compiler</tspan><tspan x="970" dy="22.1">version, six prompts,</tspan><tspan x="970" dy="22.1">up to 64 generated</tspan><tspan x="970" dy="22.1">tokens, ASCII only.</tspan><tspan x="970" dy="22.1">The mechanism we</tspan><tspan x="970" dy="22.1">first gave was later</tspan><tspan x="970" dy="22.1">corrected.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/e29-optimizer-invariance/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
