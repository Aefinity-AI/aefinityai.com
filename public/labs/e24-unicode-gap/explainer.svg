.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L14<tspan class="ex-dot" dx="10">MIXED</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">E24: the spec never says which Unicode version defines a letter</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Can two programs</tspan><tspan x="38" dy="24.7">that follow the</tspan><tspan x="38" dy="24.7">spec exactly</tspan><tspan x="38" dy="24.7">still split the</tspan><tspan x="38" dy="24.7">same text</tspan><tspan x="38" dy="24.7">differently?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="339.4" y2="339.4"/><text class="ex-lab" x="38" y="357.4" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="377.4" font-size="14"><tspan x="38" dy="0">Splitting text into tokens</tspan><tspan x="38" dy="18.9">depends on which</tspan><tspan x="38" dy="18.9">characters count as</tspan><tspan x="38" dy="18.9">letters. Two programs that</tspan><tspan x="38" dy="18.9">follow the spec could</tspan><tspan x="38" dy="18.9">split differently.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="212.7" r="11"/><text class="ex-numt" x="322" y="217.2" font-size="13" text-anchor="middle">1</text><g transform="translate(340 201.72) scale(0.917)"><path class="ex-ic" d="M12 4l9 16H3z M12 10v4 M12 17v.5"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Notice our own CI check fail</tspan><tspan x="372" dy="18.5">the same way on x86_64 and</tspan><tspan x="372" dy="18.5">aarch64.</tspan></text><rect class="ex-sub" x="302" y="269.4" width="306" height="111.9" rx="9"/><circle class="ex-num" cx="322" cy="325.4" r="11"/><text class="ex-numt" x="322" y="329.9" font-size="13" text-anchor="middle">2</text><g transform="translate(340 314.4) scale(0.917)"><path class="ex-ic" d="M4 8h13 M14 5l3 3-3 3 M20 16H7 M10 13l-3 3 3 3"/></g><text class="ex-t" x="372" y="301.7" font-size="14"><tspan x="372" dy="0">Generate the letter, number</tspan><tspan x="372" dy="18.5">and whitespace tables under</tspan><tspan x="372" dy="18.5">Unicode 15.0.0 and 15.1.0 and</tspan><tspan x="372" dy="18.5">compare them.</tspan></text><rect class="ex-sub" x="302" y="391.4" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="428.8" r="11"/><text class="ex-numt" x="322" y="433.3" font-size="13" text-anchor="middle">3</text><g transform="translate(340 417.84000000000003) scale(0.917)"><path class="ex-ic" d="M8 5l11 7-11 7z"/></g><text class="ex-t" x="372" y="423.7" font-size="14"><tspan x="372" dy="0">Encode four test strings with</tspan><tspan x="372" dy="18.5">both tables.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="74" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">MIXED</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">Spec names no</tspan><tspan x="664" dy="31.4">Unicode</tspan><tspan x="664" dy="31.4">version</tspan></text><text class="ex-t" x="664" y="344.2" font-size="14.5"><tspan x="664" dy="0">The set of letters grew by 622</tspan><tspan x="664" dy="19.7">characters between Unicode</tspan><tspan x="664" dy="19.7">15.0.0 and 15.1.0 (136,104 to</tspan><tspan x="664" dy="19.7">136,726); numbers and</tspan><tspan x="664" dy="19.7">whitespace did not change.</tspan><tspan x="664" dy="19.7">Spec v0.3b names no Unicode</tspan><tspan x="664" dy="19.7">version. For the pinned</tspan><tspan x="664" dy="19.7">vocabulary the four test</tspan><tspan x="664" dy="19.7">strings encoded identically,</tspan><tspan x="664" dy="19.7">so no published digest moves.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">A spec can be exact</tspan><tspan x="970" dy="22.1">about arithmetic and</tspan><tspan x="970" dy="22.1">still leave the input</tspan><tspan x="970" dy="22.1">text under-specified.</tspan><tspan x="970" dy="22.1">A bounded finding,</tspan><tspan x="970" dy="22.1">not a reproduction</tspan><tspan x="970" dy="22.1">failure. The fix is</tspan><tspan x="970" dy="22.1">proposed for v0.4 and</tspan><tspan x="970" dy="22.1">is a maintainer</tspan><tspan x="970" dy="22.1">decision.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like a game rule that says &#x27;words only&#x27; but never says which dictionary edition.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/e24-unicode-gap/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
