<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="E24: the spec never says which Unicode version defines a letter: the test explained in one picture"><title>E24: the spec never says which Unicode version defines a letter: the test explained in one picture</title><desc>Question: Can two programs that follow the spec exactly still split the same text differently? How we tested: 1. Notice our own CI check fail the same way on x86_64 and aarch64. 2. Generate the letter, number and whitespace tables under Unicode 15.0.0 and 15.1.0 and compare them. 3. Encode four test strings with both tables. What we found (Mixed): Spec names no Unicode version. The set of letters grew by 622 characters between Unicode 15.0.0 and 15.1.0 (136,104 to 136,726); numbers and whitespace did not change. Spec v0.3b names no Unicode version. For the pinned vocabulary the four test strings encoded identically, so no published digest moves. What it means: A spec can be exact about arithmetic and still leave the input text under-specified. A bounded finding, not a reproduction failure. The fix is proposed for v0.4 and is a maintainer decision.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-mixed);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
