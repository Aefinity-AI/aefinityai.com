.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L07<tspan class="ex-dot" dx="10">POSITIVE</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">Realistic edits to the embedding table, including one hidden row</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="427.79999999999995" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M274.0 327.9l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M630.0 327.9l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="427.79999999999995" rx="12"/><path class="ex-chev" d="M940.0 327.9l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Can a small,</tspan><tspan x="38" dy="24.7">realistic edit to</tspan><tspan x="38" dy="24.7">a model hide from</tspan><tspan x="38" dy="24.7">output checks if</tspan><tspan x="38" dy="24.7">the test prompts</tspan><tspan x="38" dy="24.7">never touch it?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="339.4" y2="339.4"/><text class="ex-lab" x="38" y="357.4" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="377.4" font-size="14"><tspan x="38" dy="0">A realistic model edit may</tspan><tspan x="38" dy="18.9">touch only rare words. If</tspan><tspan x="38" dy="18.9">your tests never use those</tspan><tspan x="38" dy="18.9">words, output checks pass</tspan><tspan x="38" dy="18.9">while the model has</tspan><tspan x="38" dy="18.9">changed.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="96.8" rx="9"/><circle class="ex-num" cx="322" cy="214.4" r="11"/><text class="ex-numt" x="322" y="218.9" font-size="13" text-anchor="middle">1</text><g transform="translate(340 203.415) scale(0.917)"><path class="ex-ic" d="M14.5 4a4.5 4.5 0 0 0-4 6.3L4 16.8 7.2 20l6.5-6.5A4.5 4.5 0 0 0 20 9.5l-3 3-3-1-1-3 3-3z"/></g><text class="ex-t" x="372" y="194.1" font-size="12"><tspan x="372" dy="0">Edit the model&#x27;s word table in</tspan><tspan x="372" dy="15.8">realistic ways: INT8 round-trip,</tspan><tspan x="372" dy="15.8">1% pruning, a fine-tune-style</tspan><tspan x="372" dy="15.8">patch, single rows.</tspan></text><rect class="ex-sub" x="302" y="272.8" width="306" height="81.0" rx="9"/><circle class="ex-num" cx="322" cy="313.3" r="11"/><text class="ex-numt" x="322" y="317.8" font-size="13" text-anchor="middle">2</text><g transform="translate(340 302.325) scale(0.917)"><path class="ex-ic" d="M9 6h11 M9 12h11 M9 18h11 M4 6h.5 M4 12h.5 M4 18h.5"/></g><text class="ex-t" x="372" y="301.0" font-size="12"><tspan x="372" dy="0">For single rows: 8 rows the</tspan><tspan x="372" dy="15.8">prompts never read, 8 they do</tspan><tspan x="372" dy="15.8">read, 5 prompts each (40 trials).</tspan></text><rect class="ex-sub" x="302" y="363.8" width="306" height="81.0" rx="9"/><circle class="ex-num" cx="322" cy="404.3" r="11"/><text class="ex-numt" x="322" y="408.8" font-size="13" text-anchor="middle">3</text><g transform="translate(340 393.315) scale(0.917)"><path class="ex-ic" d="M4 8h13 M14 5l3 3-3 3 M20 16H7 M10 13l-3 3 3 3"/></g><text class="ex-t" x="372" y="392.0" font-size="12"><tspan x="372" dy="0">Compare three detectors with the</tspan><tspan x="372" dy="15.8">unedited model: text replay,</tspan><tspan x="372" dy="15.8">top-5 logits, computation digest.</tspan></text><rect class="ex-sub" x="302" y="454.8" width="306" height="81.0" rx="9"/><circle class="ex-num" cx="322" cy="495.3" r="11"/><text class="ex-numt" x="322" y="499.8" font-size="13" text-anchor="middle">4</text><g transform="translate(340 484.305) scale(0.917)"><path class="ex-ic" d="M5 5v14 M10 5v14 M15 5v14 M3 17L21 7"/></g><text class="ex-t" x="372" y="482.9" font-size="12"><tspan x="372" dy="0">Report counts with 95% intervals.</tspan><tspan x="372" dy="15.8">A same-shape model swap was</tspan><tspan x="372" dy="15.8">judged infeasible and not run.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="391.79999999999995" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="96" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">POSITIVE</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">0 of 40 caught</tspan><tspan x="664" dy="31.4">by output</tspan><tspan x="664" dy="31.4">checks</tspan></text><text class="ex-t" x="664" y="344.6" font-size="15"><tspan x="664" dy="0">For one edited row that no</tspan><tspan x="664" dy="20.4">test prompt read, text replay</tspan><tspan x="664" dy="20.4">and the top-5 check each</tspan><tspan x="664" dy="20.4">caught 0 of 40; the</tspan><tspan x="664" dy="20.4">computation digest caught 40</tspan><tspan x="664" dy="20.4">of 40. When prompts did read</tspan><tspan x="664" dy="20.4">the row, top-5 caught 21 of</tspan><tspan x="664" dy="20.4">40 and text replay 11 of 40.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">Output checks are</tspan><tspan x="970" dy="22.1">only as good as your</tspan><tspan x="970" dy="22.1">test prompts. Small</tspan><tspan x="970" dy="22.1">samples (20 or 40),</tspan><tspan x="970" dy="22.1">one model, embedding</tspan><tspan x="970" dy="22.1">table only; a smarter</tspan><tspan x="970" dy="22.1">attacker and the</tspan><tspan x="970" dy="22.1">digest&#x27;s</tspan><tspan x="970" dy="22.1">false-positive rate</tspan><tspan x="970" dy="22.1">were not tested.</tspan></text><rect class="ex-strip" x="24" y="559.8" width="1152" height="36.2" rx="9"/><text class="ex-t ex-em" x="42" y="581.7" font-size="14"><tspan x="42" dy="0">Like proofreading a book by reading only chapters 1 to 3: an edit on page 200 slips through.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/embedding-edits/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
