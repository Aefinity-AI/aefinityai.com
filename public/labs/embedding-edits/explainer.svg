<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Realistic edits to the embedding table, including one hidden row: the test explained in one picture"><title>Realistic edits to the embedding table, including one hidden row: the test explained in one picture</title><desc>Question: Can a small, realistic edit to a model hide from output checks if the test prompts never touch it? How we tested: 1. Edit the model&#x27;s word table in realistic ways: INT8 round-trip, 1% pruning, a fine-tune-style patch, single rows. 2. For single rows: 8 rows the prompts never read, 8 they do read, 5 prompts each (40 trials). 3. Compare three detectors with the unedited model: text replay, top-5 logits, computation digest. 4. Report counts with 95% intervals. A same-shape model swap was judged infeasible and not run. What we found (Positive): 0 of 40 caught by output checks. For one edited row that no test prompt read, text replay and the top-5 check each caught 0 of 40; the computation digest caught 40 of 40. When prompts did read the row, top-5 caught 21 of 40 and text replay 11 of 40. What it means: Output checks are only as good as your test prompts. Small samples (20 or 40), one model, embedding table only; a smarter attacker and the digest&#x27;s false-positive rate were not tested.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-positive);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
