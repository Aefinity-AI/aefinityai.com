<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="RANGER mock run: low-bit quantization ideas tested on synthetic tensors: the test explained in one picture"><title>RANGER mock run: low-bit quantization ideas tested on synthetic tensors: the test explained in one picture</title><desc>Question: Do popular tricks for shrinking AI models to very few bits actually work, when tested where they can fail? How we tested: 1. Build synthetic tensors with documented outlier patterns, fixed seed 20260714. 2. Run tests E0 to E5, plus a follow-up E6, in pure numpy. 3. Rebuild any test that did not compute its target. What we found (Mixed): Rotation helps 4-bit only. Bits saved per width doubling came out at -0.60 against a predicted -0.50, after we rebuilt a first test that was not computing the target. Rotation helped at 4-bit (1.23x) but was slightly worse than plain per-token quantization at 3 and 2 bits (0.92x). What it means: On made-up data one idea was falsified and two design rules emerged. These are mechanism-level findings, not claims about real models.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-mixed);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L25<tspan class="ex-dot" dx="10">MIXED</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">RANGER mock run: low-bit quantization ideas tested on synthetic tensors</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="476" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="476" rx="12"/><path class="ex-chev" d="M274.0 352.0l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="476" rx="12"/><path class="ex-chev" d="M630.0 352.0l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="476" rx="12"/><path class="ex-chev" d="M940.0 352.0l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Do popular tricks</tspan><tspan x="38" dy="24.7">for shrinking AI</tspan><tspan x="38" dy="24.7">models to very</tspan><tspan x="38" dy="24.7">few bits actually</tspan><tspan x="38" dy="24.7">work, when tested</tspan><tspan x="38" dy="24.7">where they can</tspan><tspan x="38" dy="24.7">fail?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="364.1" y2="364.1"/><text class="ex-lab" x="38" y="382.1" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="402.1" font-size="14"><tspan x="38" dy="0">Low-bit compression ideas</tspan><tspan x="38" dy="18.9">often look good in prose.</tspan><tspan x="38" dy="18.9">We tested them where they</tspan><tspan x="38" dy="18.9">could fail.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="212.7" r="11"/><text class="ex-numt" x="322" y="217.2" font-size="13" text-anchor="middle">1</text><g transform="translate(340 201.72) scale(0.917)"><path class="ex-ic" d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Build synthetic tensors with</tspan><tspan x="372" dy="18.5">documented outlier patterns,</tspan><tspan x="372" dy="18.5">fixed seed 20260714.</tspan></text><rect class="ex-sub" x="302" y="269.4" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="306.9" r="11"/><text class="ex-numt" x="322" y="311.4" font-size="13" text-anchor="middle">2</text><g transform="translate(340 295.92) scale(0.917)"><path class="ex-ic" d="M8 5l11 7-11 7z"/></g><text class="ex-t" x="372" y="301.7" font-size="14"><tspan x="372" dy="0">Run tests E0 to E5, plus a</tspan><tspan x="372" dy="18.5">follow-up E6, in pure numpy.</tspan></text><rect class="ex-sub" x="302" y="354.4" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="391.9" r="11"/><text class="ex-numt" x="322" y="396.4" font-size="13" text-anchor="middle">3</text><g transform="translate(340 380.88) scale(0.917)"><path class="ex-ic" d="M14.5 4a4.5 4.5 0 0 0-4 6.3L4 16.8 7.2 20l6.5-6.5A4.5 4.5 0 0 0 20 9.5l-3 3-3-1-1-3 3-3z"/></g><text class="ex-t" x="372" y="386.7" font-size="14"><tspan x="372" dy="0">Rebuild any test that did not</tspan><tspan x="372" dy="18.5">compute its target.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="440" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="74" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">MIXED</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">Rotation helps</tspan><tspan x="664" dy="31.4">4-bit only</tspan></text><text class="ex-t" x="664" y="313.3" font-size="15"><tspan x="664" dy="0">Bits saved per width doubling</tspan><tspan x="664" dy="20.4">came out at -0.60 against a</tspan><tspan x="664" dy="20.4">predicted -0.50, after we</tspan><tspan x="664" dy="20.4">rebuilt a first test that was</tspan><tspan x="664" dy="20.4">not computing the target.</tspan><tspan x="664" dy="20.4">Rotation helped at 4-bit</tspan><tspan x="664" dy="20.4">(1.23x) but was slightly</tspan><tspan x="664" dy="20.4">worse than plain per-token</tspan><tspan x="664" dy="20.4">quantization at 3 and 2 bits</tspan><tspan x="664" dy="20.4">(0.92x).</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">On made-up data one</tspan><tspan x="970" dy="22.1">idea was falsified</tspan><tspan x="970" dy="22.1">and two design rules</tspan><tspan x="970" dy="22.1">emerged. These are</tspan><tspan x="970" dy="22.1">mechanism-level</tspan><tspan x="970" dy="22.1">findings, not claims</tspan><tspan x="970" dy="22.1">about real models.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/ranger-mock-run/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
