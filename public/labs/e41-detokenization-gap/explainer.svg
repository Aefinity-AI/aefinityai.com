.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L21<tspan class="ex-dot" dx="10">NEGATIVE</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">E41: the spec pins how text becomes tokens, but not how tokens become text</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="476" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="476" rx="12"/><path class="ex-chev" d="M274.0 352.0l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="476" rx="12"/><path class="ex-chev" d="M630.0 352.0l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="476" rx="12"/><path class="ex-chev" d="M940.0 352.0l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="187.2" font-size="19"><tspan x="38" dy="0">Could two</tspan><tspan x="38" dy="24.7">programs that</tspan><tspan x="38" dy="24.7">both follow the</tspan><tspan x="38" dy="24.7">spec agree on</tspan><tspan x="38" dy="24.7">every digest yet</tspan><tspan x="38" dy="24.7">print different</tspan><tspan x="38" dy="24.7">text?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="364.1" y2="364.1"/><text class="ex-lab" x="38" y="382.1" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="402.1" font-size="14"><tspan x="38" dy="0">A receipt is read by</tspan><tspan x="38" dy="18.9">people. If two conforming</tspan><tspan x="38" dy="18.9">programs can print</tspan><tspan x="38" dy="18.9">different text for the</tspan><tspan x="38" dy="18.9">same digests, the</tspan><tspan x="38" dy="18.9">receipt&#x27;s meaning is not</tspan><tspan x="38" dy="18.9">pinned.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="212.7" r="11"/><text class="ex-numt" x="322" y="217.2" font-size="13" text-anchor="middle">1</text><g transform="translate(340 201.72) scale(0.917)"><path class="ex-ic" d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Read the spec against the</tspan><tspan x="372" dy="18.5">tokenizers of the two named</tspan><tspan x="372" dy="18.5">models.</tspan></text><rect class="ex-sub" x="302" y="269.4" width="306" height="111.9" rx="9"/><circle class="ex-num" cx="322" cy="325.4" r="11"/><text class="ex-numt" x="322" y="329.9" font-size="13" text-anchor="middle">2</text><g transform="translate(340 314.4) scale(0.917)"><path class="ex-ic" d="M5 5v14 M10 5v14 M15 5v14 M3 17L21 7"/></g><text class="ex-t" x="372" y="301.7" font-size="14"><tspan x="372" dy="0">Count vocabulary entries and</tspan><tspan x="372" dy="18.5">output slots where turning</tspan><tspan x="372" dy="18.5">ids back into text is</tspan><tspan x="372" dy="18.5">ambiguous.</tspan></text><rect class="ex-sub" x="302" y="391.4" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="428.8" r="11"/><text class="ex-numt" x="322" y="433.3" font-size="13" text-anchor="middle">3</text><g transform="translate(340 417.84000000000003) scale(0.917)"><path class="ex-ic" d="M8 5l11 7-11 7z"/></g><text class="ex-t" x="372" y="423.7" font-size="14"><tspan x="372" dy="0">Probe with small Rust</tspan><tspan x="372" dy="18.5">examples.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="440" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="96" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">NEGATIVE</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">313 + 271</tspan><tspan x="664" dy="31.4">ambiguous</tspan><tspan x="664" dy="31.4">entries</tspan></text><text class="ex-t" x="664" y="344.6" font-size="15"><tspan x="664" dy="0">313 of SmolLM2&#x27;s 49,152</tspan><tspan x="664" dy="20.4">vocabulary entries (0.64%)</tspan><tspan x="664" dy="20.4">are not valid text on their</tspan><tspan x="664" dy="20.4">own. 271 of Qwen&#x27;s 151,936</tspan><tspan x="664" dy="20.4">output slots map to no</tspan><tspan x="664" dy="20.4">string. All 17 of SmolLM2&#x27;s</tspan><tspan x="664" dy="20.4">special tokens decode to text</tspan><tspan x="664" dy="20.4">that re-encodes to different</tspan><tspan x="664" dy="20.4">ids. So two conforming</tspan><tspan x="664" dy="20.4">programs can disagree on what</tspan><tspan x="664" dy="20.4">a receipt says.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">Matching digests is</tspan><tspan x="970" dy="22.1">not the same as</tspan><tspan x="970" dy="22.1">matching meaning: the</tspan><tspan x="970" dy="22.1">spec pins text to</tspan><tspan x="970" dy="22.1">tokens but not tokens</tspan><tspan x="970" dy="22.1">to text. A gap in our</tspan><tspan x="970" dy="22.1">spec, not a defect in</tspan><tspan x="970" dy="22.1">the models. It does</tspan><tspan x="970" dy="22.1">not show that any</tspan><tspan x="970" dy="22.1">real receipt was</tspan><tspan x="970" dy="22.1">misread.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/e41-detokenization-gap/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
