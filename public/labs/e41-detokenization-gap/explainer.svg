<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="E41: the spec pins how text becomes tokens, but not how tokens become text: the test explained in one picture"><title>E41: the spec pins how text becomes tokens, but not how tokens become text: the test explained in one picture</title><desc>Question: Could two programs that both follow the spec agree on every digest yet print different text? How we tested: 1. Read the spec against the tokenizers of the two named models. 2. Count vocabulary entries and output slots where turning ids back into text is ambiguous. 3. Probe with small Rust examples. What we found (Negative): 313 + 271 ambiguous entries. 313 of SmolLM2&#x27;s 49,152 vocabulary entries (0.64%) are not valid text on their own. 271 of Qwen&#x27;s 151,936 output slots map to no string. All 17 of SmolLM2&#x27;s special tokens decode to text that re-encodes to different ids. So two conforming programs can disagree on what a receipt says. What it means: Matching digests is not the same as matching meaning: the spec pins text to tokens but not tokens to text. A gap in our spec, not a defect in the models. It does not show that any real receipt was misread.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-negative);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
