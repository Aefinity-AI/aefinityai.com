<svg xmlns="http://www.w3.org/2000/svg" class="ex" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Our test standard and the public experiment ledger: the test explained in one picture"><title>Our test standard and the public experiment ledger: the test explained in one picture</title><desc>Question: How can an outsider tell that a lab did not tune its results after the fact, rewrite them later, or quietly drop the failures? How we tested: 1. Write the pass mark before the run. 2. Publish a salted, hash-chained fingerprint of the private register. 3. Number every defect as an erratum. 4. Remove numbers that have no provenance. What we found (Mixed): 84 experiments, 65 verdicts. The public ledger holds 235 lines covering 84 registered experiments; 65 have a verdict line and 161 of the 235 lines are backfill. The page says what it cannot prove: it cannot show when an experiment ran, and the start rule is a promise it cannot check itself. What it means: It shows how we test and what the method cannot prove. No outsider has audited whether we always followed it, and backfill lines prove existence only from their publication date.</desc><style>.ex{--bg:#f6f5f1;--bg-2:#efede6;--surface:#fffefb;--ink:#15171a;--ink-2:#33373d;--muted:#5d6269;--line:#dcd9d0;--line-2:#c9c5b9;--accent:#0b6670;--accent-ink:#ffffff;--accent-soft:#e2efee;--o-positive:#1f7a3d;--o-mixed:#9a5b00;--o-negative:#b3261e;--o-null:#59616c;--o-held:#6a3fb5;--o:var(--o-mixed);--sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;--mono:"Geist Mono", ui-monospace, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){.ex{--bg:#0e1013;--bg-2:#14171b;--surface:#171a1f;--ink:#ebe8e1;--ink-2:#cfccc4;--muted:#a0a5ad;--line:#2a2e35;--line-2:#3a3f47;--accent:#5fd0c2;--accent-ink:#06201d;--accent-soft:#12302d;--o-positive:#5ccf86;--o-mixed:#e2a73e;--o-negative:#ff7b72;--o-null:#9aa4b2;--o-held:#b49cff;}}
.ex-bg { fill: var(--surface); }
.ex-panel { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.ex-panel-r { stroke: var(--o); stroke-width: 1.5; }
.ex-sub { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.ex-strip { fill: var(--accent-soft); }
.ex-t { fill: var(--ink-2); font-family: var(--sans); }
.ex-em { font-style: italic; }
.ex-q, .ex-title { fill: var(--ink); font-family: var(--sans); font-weight: 600; }
.ex-lab { fill: var(--muted); font-family: var(--mono); letter-spacing: .08em; }
.ex-code { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
.ex-dot { fill: var(--o); font-family: var(--mono); letter-spacing: .08em; }
.ex-head { fill: var(--o); font-family: var(--sans); font-weight: 700; }
.ex-bar { fill: var(--o); }
.ex-pill { fill: var(--o); fill-opacity: .14; stroke: var(--o); stroke-width: 1.2; }
.ex-pdot { fill: var(--o); }
.ex-pilt { fill: var(--ink); font-family: var(--mono); font-weight: 500; letter-spacing: .06em; }
.ex-num { fill: var(--accent); }
.ex-numt { fill: var(--accent-ink); font-family: var(--sans); font-weight: 600; }
.ex-ic, .ex-mg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ex-ic { stroke: var(--accent); stroke-width: 1.7; }
.ex-chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-rule { stroke: var(--line); stroke-width: 1; }
.ex-foot { fill: var(--muted); font-family: var(--mono); }
.ex-mq { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.ex-mqt { fill: var(--accent); font-family: var(--sans); font-weight: 700; }
.ex-msub { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.ex-mv { fill: var(--o); fill-opacity: .16; stroke: var(--o); stroke-width: 1.5; }
.ex-mg { stroke: var(--o); stroke-width: 2.2; }</style><rect class="ex-bg" width="1200" height="630"/><text class="ex-code" x="24" y="38" font-size="15">L23<tspan class="ex-dot" dx="10">MIXED</tspan></text><text class="ex-title" x="24" y="68.0" font-size="24"><tspan x="24" dy="0">Our test standard and the public experiment ledger</tspan></text><rect class="ex-panel" x="24" y="120" width="240" height="476" rx="12"/><rect class="ex-panel" x="290" y="120" width="330" height="476" rx="12"/><path class="ex-chev" d="M274.0 352.0l5 6-5 6"/><rect class="ex-panel ex-panel-r" x="646" y="120" width="284" height="476" rx="12"/><path class="ex-chev" d="M630.0 352.0l5 6-5 6"/><rect class="ex-panel" x="956" y="120" width="220" height="476" rx="12"/><path class="ex-chev" d="M940.0 352.0l5 6-5 6"/><text class="ex-lab" x="38" y="148" font-size="12">1 &#183; THE QUESTION</text><text class="ex-q" x="38" y="186.4" font-size="18"><tspan x="38" dy="0">How can an</tspan><tspan x="38" dy="23.4">outsider tell that</tspan><tspan x="38" dy="23.4">a lab did not tune</tspan><tspan x="38" dy="23.4">its results after</tspan><tspan x="38" dy="23.4">the fact, rewrite</tspan><tspan x="38" dy="23.4">them later, or</tspan><tspan x="38" dy="23.4">quietly drop the</tspan><tspan x="38" dy="23.4">failures?</tspan></text><line class="ex-rule" x1="38" x2="250" y1="377.6" y2="377.6"/><text class="ex-lab" x="38" y="395.6" font-size="11">WHY IT MATTERS</text><text class="ex-t" x="38" y="415.6" font-size="14"><tspan x="38" dy="0">Results are only as</tspan><tspan x="38" dy="18.9">credible as the process</tspan><tspan x="38" dy="18.9">behind them.</tspan></text><text class="ex-lab" x="304" y="148" font-size="12">2 &#183; HOW WE TESTED IT</text><rect class="ex-sub" x="302" y="166.0" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="203.5" r="11"/><text class="ex-numt" x="322" y="208.0" font-size="13" text-anchor="middle">1</text><g transform="translate(340 192.48000000000002) scale(0.917)"><path class="ex-ic" d="M4 20l4-1 11-11-3-3L5 16z M14 7l3 3"/></g><text class="ex-t" x="372" y="198.3" font-size="14"><tspan x="372" dy="0">Write the pass mark before</tspan><tspan x="372" dy="18.5">the run.</tspan></text><rect class="ex-sub" x="302" y="251.0" width="306" height="93.4" rx="9"/><circle class="ex-num" cx="322" cy="297.7" r="11"/><text class="ex-numt" x="322" y="302.2" font-size="13" text-anchor="middle">2</text><g transform="translate(340 286.68) scale(0.917)"><path class="ex-ic" d="M9 4L7 20 M17 4l-2 16 M4 9h17 M3 15h17"/></g><text class="ex-t" x="372" y="283.3" font-size="14"><tspan x="372" dy="0">Publish a salted,</tspan><tspan x="372" dy="18.5">hash-chained fingerprint of</tspan><tspan x="372" dy="18.5">the private register.</tspan></text><rect class="ex-sub" x="302" y="354.4" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="391.9" r="11"/><text class="ex-numt" x="322" y="396.4" font-size="13" text-anchor="middle">3</text><g transform="translate(340 380.88) scale(0.917)"><path class="ex-ic" d="M9 6h11 M9 12h11 M9 18h11 M4 6h.5 M4 12h.5 M4 18h.5"/></g><text class="ex-t" x="372" y="386.7" font-size="14"><tspan x="372" dy="0">Number every defect as an</tspan><tspan x="372" dy="18.5">erratum.</tspan></text><rect class="ex-sub" x="302" y="439.4" width="306" height="75.0" rx="9"/><circle class="ex-num" cx="322" cy="476.8" r="11"/><text class="ex-numt" x="322" y="481.3" font-size="13" text-anchor="middle">4</text><g transform="translate(340 465.84000000000003) scale(0.917)"><path class="ex-ic" d="M14.5 4a4.5 4.5 0 0 0-4 6.3L4 16.8 7.2 20l6.5-6.5A4.5 4.5 0 0 0 20 9.5l-3 3-3-1-1-3 3-3z"/></g><text class="ex-t" x="372" y="471.7" font-size="14"><tspan x="372" dy="0">Remove numbers that have no</tspan><tspan x="372" dy="18.5">provenance.</tspan></text><rect class="ex-bar" x="646" y="138" width="4" height="440" rx="2"/><text class="ex-lab" x="664" y="148" font-size="12">3 &#183; WHAT WE FOUND</text><rect class="ex-pill" x="664" y="162" width="74" height="26" rx="13"/><circle class="ex-pdot" cx="678" cy="175" r="5"/><text class="ex-pilt" x="690" y="179.5" font-size="12.5">MIXED</text><text class="ex-head" x="664" y="227.8" font-size="28"><tspan x="664" dy="0">84</tspan><tspan x="664" dy="31.4">experiments,</tspan><tspan x="664" dy="31.4">65 verdicts</tspan></text><text class="ex-t" x="664" y="344.6" font-size="15"><tspan x="664" dy="0">The public ledger holds 235</tspan><tspan x="664" dy="20.4">lines covering 84 registered</tspan><tspan x="664" dy="20.4">experiments; 65 have a</tspan><tspan x="664" dy="20.4">verdict line and 161 of the</tspan><tspan x="664" dy="20.4">235 lines are backfill. The</tspan><tspan x="664" dy="20.4">page says what it cannot</tspan><tspan x="664" dy="20.4">prove: it cannot show when an</tspan><tspan x="664" dy="20.4">experiment ran, and the start</tspan><tspan x="664" dy="20.4">rule is a promise it cannot</tspan><tspan x="664" dy="20.4">check itself.</tspan></text><text class="ex-lab" x="970" y="148" font-size="12">4 &#183; WHAT IT MEANS</text><text class="ex-t" x="970" y="184.8" font-size="16"><tspan x="970" dy="0">It shows how we test</tspan><tspan x="970" dy="22.1">and what the method</tspan><tspan x="970" dy="22.1">cannot prove. No</tspan><tspan x="970" dy="22.1">outsider has audited</tspan><tspan x="970" dy="22.1">whether we always</tspan><tspan x="970" dy="22.1">followed it, and</tspan><tspan x="970" dy="22.1">backfill lines prove</tspan><tspan x="970" dy="22.1">existence only from</tspan><tspan x="970" dy="22.1">their publication</tspan><tspan x="970" dy="22.1">date.</tspan></text><text class="ex-foot" x="24" y="616" font-size="12">aefinityai.com/labs/test-standard-ledger/</text><text class="ex-foot" x="1176" y="616" font-size="12" text-anchor="end">Run by us; no unaffiliated reproduction</text></svg>
